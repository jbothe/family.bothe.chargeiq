<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --text: #0b1220;
      --muted: #6b7280;
      --tile: #e2e5ea;
      --green: #16a34a;
      --purple: #8b5cf6;
      --conn-static: #d8dce3;
      --flow: #2563eb;
      --meter-track: rgba(11, 18, 32, 0.14);
      /* Bus gradient reflects live grid state: importing (drawing from the grid), exporting
         (feeding it), or neutral (no meaningful grid flow). Same tones in both themes — these
         are status colors, not surface colors. */
      --bus-import-a: #ef4444; --bus-import-b: #f59e0b;
      --bus-export-a: #16a34a; --bus-export-b: #22c55e;
      --bus-neutral-a: #8b5cf6; --bus-neutral-b: #c4b5fd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #ffffff; --muted: #8b93a1;
        --tile: #363b47;
        --green: #3ddc97; --purple: #a78bfa;
        --conn-static: #3a3d47;
        --flow: #60a5fa;
        --meter-track: rgba(255, 255, 255, 0.16);
      }
    }
    :root[data-theme="dark"] {
      --text: #ffffff; --muted: #8b93a1;
      --tile: #363b47;
      --green: #3ddc97; --purple: #a78bfa;
      --conn-static: #3a3d47;
      --flow: #60a5fa;
      --meter-track: rgba(255, 255, 255, 0.16);
    }
    :root[data-theme="light"] {
      --text: #0b1220; --muted: #6b7280;
      --tile: #e2e5ea;
      --green: #16a34a; --purple: #8b5cf6;
      --conn-static: #d8dce3;
      --flow: #2563eb;
      --meter-track: rgba(11, 18, 32, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif; color: var(--text);
           -webkit-font-smoothing: antialiased; }
    .card { padding: 12px 14px 10px; transition: opacity .5s ease, filter .5s ease; }
    /* Stale: data hasn't refreshed recently (network/wifi blip). Dim, keep last values, auto-recover. */
    .card.stale { opacity: 0.4; filter: grayscale(0.85); }

    @keyframes flowDown { from { background-position: 0 0; } to { background-position: 0 6px; } }
    @keyframes flowUp { from { background-position: 0 0; } to { background-position: 0 -6px; } }

    /* Header row: EV (left) / Solar (right). Icons are pinned at fixed x-positions (25%/75%
       of the row) via absolute positioning instead of being centered together with their
       value text in a shrink-wrapped flex group — otherwise the icon shifts sideways every
       time the value's digit count changes width. Text is anchored to the same fixed point
       and grows outward (away from center), so it never pushes the icon either. */
    .headrow { position: relative; height: 78px; }
    .hicon { display: flex; flex-direction: column; align-items: center; gap: 4px;
             position: absolute; top: 0; }
    .hcol.ev .hicon { left: 25%; transform: translateX(-50%); }
    .hcol.solar .hicon { left: 75%; transform: translateX(-50%); }
    /* top:0 (not a translateY(-50%) center) plus an explicit height matching .tile's own
       44px, with justify-content:center centering the 2-line content block within that
       band - not a translateY trick, so it holds regardless of gap. Both .htext and
       .mode-stack use the same top/height/gap, so their content centers identically and
       each line lines up with its counterpart in the other stack (.lbl with .chip, .val
       with .mode-row) - not just the block as a whole. Both children still need an
       explicit height (not line-height) for that gap math to be deterministic: mixing two
       font-sizes on one line (e.g. .val's bold number next to its smaller .unit span)
       makes the browser's own line-box taller than a specified line-height, so line-height
       alone doesn't actually clamp the rendered height - confirmed via
       getBoundingClientRect (a 20px line-height still measured 23px tall). */
    .htext { display: flex; flex-direction: column; justify-content: center; gap: 4px;
             height: 44px; position: absolute; top: 0; }
    .hcol.ev .htext { right: calc(75% + 30px); align-items: flex-end; }
    .hcol.solar .htext { left: calc(75% + 30px); align-items: flex-start; }

    /* position:relative (no z-index needed) lifts tiles and the bus into the positioned
       paint layer, so they're always drawn over the plain in-flow connectors — letting a
       connector's negative margin overlap *underneath* a tile/bus regardless of DOM order,
       for a seamless bleed instead of a visible gap. overflow:hidden clips the capacity
       .meter strip (see below) to the tile's own rounded corners, so it bleeds flush to the
       edge without needing to duplicate the radius on the strip itself. */
    .tile { width: 44px; height: 44px; border-radius: 10px; flex: 0 0 auto; position: relative;
            display: grid; place-items: center; background: var(--tile); overflow: hidden; }
    .tile svg { display: block; }

    /* Capacity meter: a full-bleed strip flush to the tile edge nearest its connector
       (bottom for EV/Solar in the header row, top for Grid/Battery in the device row -
       see PF.meter/meterHtml), not a floating inset bar. Appended into the tile's own
       innerHTML each render (see render()) since the icon markup already replaces it
       wholesale every tick. The strip's own width is pixel-rescaled in PF.meterHtml, not
       a plain CSS percentage, to compensate for .tile's corner clip - see there. */
    .meter { position: absolute; left: 0; right: 0; height: 5px; background: var(--meter-track); }
    .meter.top { top: 0; }
    .meter.bottom { bottom: 0; }
    .meter > span { display: block; height: 100%; }

    .conn { width: 5px; height: 40px; border-radius: 2.5px; flex: 0 0 auto;
            background-color: var(--conn-static); background-size: 100% 6px; }
    .hicon .conn { margin: -10px 0 0; }  /* bleeds up into the tile above it */
    .tcol .conn { margin: 0 0 -10px; }   /* bleeds down into the tile below it */
    .conn.active.dir-down { animation: flowDown .5s linear infinite; }
    .conn.active.dir-up { animation: flowUp .5s linear infinite; }

    /* align-items:baseline (not center) so the smaller .unit span sits on the same text
       baseline as the number, not vertically centered against it - the explicit height
       still keeps the box itself deterministic (see .htext comment). gap is the space
       between the number and unit: kept in CSS rather than a literal space character in
       the markup so it survives regardless of how flex handles whitespace text nodes. */
    .val { display: flex; align-items: baseline; gap: 2px; height: 20px;
           font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .val .unit { font-size: 11px; color: var(--muted); font-weight: 600; } /* de-emphasized so the number reads first */
    /* Explicit height (not line-height/padding) gives .lbl the same rendered height as
       .chip, so the two align by center - see .mode-stack and the .htext comment above on
       why this can't just be line-height. */
    .lbl { display: flex; align-items: center; height: 16px;
           font-size: 10px; font-weight: 600; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; }

    .tile-wrap { position: relative; }

    /* EV chip + mode icon/shorthand status, stacked to the right of the EV icon (chip on
       top, icon+time beneath - mirrors .htext's label-above-value order). Same
       top/height/gap as .htext (see there) so the chip lines up with the label on the
       other side, and the icon+time row lines up with the power value, regardless of the
       chip's content (plain text label or the bolt-icon+amps charging variant - both are
       16px tall either way, see .chip). */
    .mode-stack { position: absolute; left: 100%; top: 0; margin-left: 6px; height: 44px;
                  display: flex; flex-direction: column; justify-content: center;
                  align-items: flex-start; gap: 4px; }
    .mode-row { display: flex; align-items: center; gap: 4px; height: 20px; }
    .mode-icon { width: 17px; height: 17px; color: var(--text); }
    .mode-icon svg { display: block; width: 100%; height: 100%; }
    .mode-icon:empty { display: none; }
    /* "→ 2:00pm" - the mode's next relevant transition (schedule window end while
       Scheduled, else the next window start). Empty (no schedule configured) collapses
       to zero width on its own, same as .mode-icon:empty. Styled to match .val .unit
       (small/muted) rather than .val itself - it's a secondary hint, not a metric. */
    .mode-time { white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--muted); }
    .boost-icon { width: 15px; height: 15px; color: #f59e0b; }
    .boost-icon svg { display: block; width: 100%; height: 100%; }
    .boost-icon:empty { display: none; }

    /* EV state chip. inline-flex + gap lets the charging chip mix an icon with its amps
       reading; plain-text chips (READY / UNPLUGGED) are unaffected since they're a single
       text-node child. Explicit height (not line-height/padding) matches .lbl's for
       center-alignment - see .mode-stack. */
    .chip { display: inline-flex; align-items: center; height: 16px; gap: 3px; white-space: nowrap;
            font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
            text-transform: uppercase; padding: 0 6px; border-radius: 999px; }
    .chip:empty { display: none; }
    .chip svg { display: block; }
    .chip.charging { color: var(--green); background: color-mix(in srgb, var(--green) 18%, transparent); }
    .chip.ready { color: var(--purple); background: color-mix(in srgb, var(--purple) 18%, transparent); }
    .chip.unplugged { color: var(--muted); background: color-mix(in srgb, var(--muted) 18%, transparent); }

    /* Power bus: negative top/bottom margins pull it into both rows' connectors. Gradient
       reflects live grid state (see PF.busState). */
    .bus { height: 6px; border-radius: 3px; margin: -6px 2px -6px; position: relative;
           transition: background .4s ease; }
    .bus.bus-import { background: linear-gradient(90deg, var(--bus-import-a), var(--bus-import-b)); }
    .bus.bus-export { background: linear-gradient(90deg, var(--bus-export-a), var(--bus-export-b)); }
    .bus.bus-neutral { background: linear-gradient(90deg, var(--bus-neutral-a), var(--bus-neutral-b)); }

    /* Device tile row: Grid / Battery / House */
    .tilerow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tcol { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
    /* Value-to-label gap kept separate from the icon-to-value gap above (.tcol's own gap) so
       it can be tuned independently - slightly tighter than the icon spacing reads better. */
    .tcol-text { display: flex; flex-direction: column; align-items: center; gap: 1px; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="headrow">
      <div class="hcol ev">
        <div class="htext">
          <div class="lbl">EV</div>
          <div class="val" id="ev-val">–</div>
        </div>
        <div class="hicon">
          <div class="tile-wrap">
            <div class="tile" id="ev-tile"></div>
            <div class="mode-stack">
              <div class="chip" id="ev-chip"></div>
              <div class="mode-row">
                <div class="mode-icon" id="mode-icon"></div>
                <div class="mode-time" id="mode-time"></div>
                <div class="boost-icon" id="mode-boost"></div>
              </div>
            </div>
          </div>
          <div class="conn" id="ev-conn"></div>
        </div>
      </div>
      <div class="hcol solar">
        <div class="hicon">
          <div class="tile" id="solar-tile"></div>
          <div class="conn" id="solar-conn"></div>
        </div>
        <div class="htext">
          <div class="lbl">Solar</div>
          <div class="val" id="solar-val">–</div>
        </div>
      </div>
    </div>

    <div class="bus" id="bus"></div>

    <div class="tilerow">
      <div class="tcol">
        <div class="conn" id="grid-conn"></div>
        <div class="tile" id="grid-tile"></div>
        <div class="tcol-text">
          <div class="val" id="grid-val">–</div>
          <div class="lbl">Grid</div>
        </div>
      </div>
      <div class="tcol">
        <div class="conn" id="battery-conn"></div>
        <div class="tile" id="battery-tile"></div>
        <div class="tcol-text">
          <div class="val" id="battery-val">–</div>
          <div class="lbl">Battery</div>
        </div>
      </div>
      <div class="tcol">
        <div class="conn" id="house-conn"></div>
        <div class="tile" id="house-tile"></div>
        <div class="tcol-text">
          <div class="val" id="house-val">–</div>
          <div class="lbl">House</div>
        </div>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    var ICONS = {
      ev: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-3.5a1 1 0 0 1 .4-.8l2.2-1.7a2 2 0 0 1 1.2-.4h8.4a2 2 0 0 1 1.2.4l2.2 1.7a1 1 0 0 1 .4.8V16"/><path d="M3 16h18"/><path d="M6 10.5 7.5 6.5A1.5 1.5 0 0 1 9 5.5h6a1.5 1.5 0 0 1 1.5 1l1.5 4"/><circle cx="7.5" cy="16.3" r="1.6"/><circle cx="16.5" cy="16.3" r="1.6"/></svg>',
      solar: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M3 8h18M3 12h18M9 4v12M15 4v12"/><path d="M9 20l1.5-4M15 20l-1.5-4"/></svg>',
      grid: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 20M12 2L5 22M9 22l1.5-6h3L15 22"/><path d="M7 14h10M8.3 8h7.4"/></svg>',
      house: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 9.5V21h14V9.5"/></svg>',
      // Lightning bolt used inline inside the EV chip when actively charging.
      bolt: '<svg width="11.5" height="11.5" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>',
      // Small "boost active" badge, shown next to the clock icon in scheduled mode.
      boost: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5-5 5 5"/><path d="M7 9l5-5 5 5"/></svg>',
    };
    // Mode icons: which derived mode is currently driving the charger, and (for solar)
    // whether there's currently enough excess to actually charge on it.
    var MODE_ICONS = {
      'solar-enough': '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
      'solar-low': '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="4.5"/><path d="M8 0.5v2M2.5 3.5l1.4 1.4M0.5 9h2"/><path d="M9 20.5h10.5a4 4 0 0 0 .4-7.96 5 5 0 0 0-9.6-1.7A4.3 4.3 0 0 0 9 20.5Z"/></svg>',
      scheduled: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
      manual: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="4" x2="6" y2="20"/><circle cx="6" cy="9" r="2" fill="currentColor" stroke="none"/><line x1="12" y1="4" x2="12" y2="20"/><circle cx="12" cy="15" r="2" fill="currentColor" stroke="none"/><line x1="18" y1="4" x2="18" y2="20"/><circle cx="18" cy="7" r="2" fill="currentColor" stroke="none"/></svg>',
    };
    function batterySvg(v) {
      return '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="' + v.color + '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="7" y="4" width="10" height="17" rx="2.5"/>' +
        '<rect x="10.5" y="1.5" width="3" height="2.5" rx="1" fill="' + v.color + '" stroke="none"/>' +
        '<rect x="8.5" y="' + v.fillY + '" width="7" height="' + v.fillHeight + '" rx="1" fill="' + v.color + '" stroke="none"/>' +
        '</svg>';
    }

    // House shares Grid's purple, and EV/Solar fall back to that same purple when idle.
    var ACCENT = { ev: 'var(--green)', solar: 'var(--green)', grid: 'var(--purple)', house: 'var(--purple)', inactive: 'var(--purple)' };

    // === POWERFLOW-LOGIC-START (inlined so the widget is self-contained; the test
    // suite extracts this exact block, so keep it dependency-free) ===
    var PF = {
      fmtW: function (w) {
        if (w == null || isNaN(w)) return '–';
        var a = Math.abs(w);
        if (a >= 1000) return (w / 1000).toFixed(1).replace(/\.0$/, '') + ' kW';
        return Math.round(w) + ' W';
      },
      cap: function (s) { return s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : ''; },
      // { mag, dir: 'up'|'down'|null } — dir picks the flowDown/flowUp keyframe, i.e. which way
      // the dash pattern visually scrolls along the connector, not an abstract "into the bus"
      // label. EV/Solar sit in the header row, above the bus, so their connector runs icon→bus
      // top-to-bottom; Grid/Battery/House sit in the tile row, below the bus, so theirs runs
      // bus→icon top-to-bottom. A source (feeds the bus) therefore animates 'down' when it's
      // above the bus (Solar) but 'up' when it's below (discharging Battery, exporting Grid);
      // a sink (draws from the bus) is the mirror: 'up' above the bus (EV), 'down' below it
      // (House, charging Battery, importing Grid).
      flow: function (kind, s) {
        s = s || {};
        var w;
        if (kind === 'ev') {
          var c = s.charger || {};
          w = c.available ? (c.powerW || 0) : 0;
          return { mag: w, dir: w > 10 ? 'up' : null };
        }
        if (kind === 'solar') { w = s.solarW || 0; return { mag: w, dir: w > 10 ? 'down' : null }; }
        if (kind === 'house') { w = s.houseW || 0; return { mag: w, dir: w > 10 ? 'down' : null }; }
        if (kind === 'battery') { w = s.batteryW || 0; return { mag: Math.abs(w), dir: w > 10 ? 'down' : (w < -10 ? 'up' : null) }; }
        if (kind === 'grid') { w = s.gridW || 0; return { mag: Math.abs(w), dir: w > 10 ? 'up' : (w < -10 ? 'down' : null) }; }
        return { mag: 0, dir: null };
      },
      // Dynamic battery glyph: outline stays fixed, fill rect scales/recolors by charge tier.
      batteryVisual: function (pct) {
        if (pct == null || isNaN(pct)) return { color: '#9aa1ad', fillHeight: 2, fillY: 17 };
        var color, frac;
        if (pct <= 5) { color = '#ef4444'; frac = 0; }
        else if (pct <= 25) { color = '#f59e0b'; frac = 0.25; }
        else if (pct <= 50) { color = '#eab308'; frac = 0.5; }
        else if (pct <= 75) { color = '#f59e0b'; frac = 0.75; }
        else { color = '#22c55e'; frac = 1; }
        var maxFill = 13;
        var fillHeight = frac === 0 ? 2 : maxFill * frac;
        var fillY = 6 + (maxFill - fillHeight);
        return { color: color, fillHeight: fillHeight, fillY: fillY };
      },
      // Which gradient the power bus should show, using the same +-10W deadband as flow().
      busState: function (gridW) {
        gridW = gridW || 0;
        if (gridW > 10) return 'import';
        if (gridW < -10) return 'export';
        return 'neutral';
      },
      // EV status chip, from the same evcharger_charging_state enum Homey's own UI uses
      // (computed once in ChargeController.toChargingState, just passed through here).
      // Charging carries no label - the render layer fills it with a bolt icon + live
      // amps (via chargeAmps) instead of static text.
      evChip: function (s) {
        s = s || {};
        var c = s.charger || {};
        if (!c.available) return null;
        if (c.chargingState === 'plugged_in_charging') return { cls: 'charging' };
        if (c.chargingState === 'plugged_in') return { label: 'READY', cls: 'ready' };
        if (c.chargingState === 'plugged_out') return { label: 'UNPLUGGED', cls: 'unplugged' };
        return null;
      },
      // Commanded charge current, shown in the EV chip while charging. charge_current_limit
      // is a target the controller only rewrites on a fresh positive value (see
      // ChargeController) - it does *not* reset to 0 on pause - so paused/not-actively-
      // charging is gated here instead of trusting the raw capability value.
      chargeAmps: function (s) {
        s = s || {};
        var c = s.charger || {};
        if (!c.available || c.chargingState !== 'plugged_in_charging') return 0;
        return c.limitA != null ? c.limitA : 0;
      },
      // Which icon represents the current mode - solar splits into two glyphs depending on
      // whether there's currently enough excess to actually charge on it.
      modeIconKey: function (s) {
        s = s || {};
        if (s.mode === 'scheduled') return 'scheduled';
        if (s.mode === 'manual') return 'manual';
        if (s.mode === 'solar') return s.solarEnough ? 'solar-enough' : 'solar-low';
        return null;
      },
      // The Date the mode's shorthand status should point to: the active window's end while
      // Scheduled (it's already running - what matters is when it stops), otherwise the next
      // schedule window's start (also the moment a manual override auto-clears, per
      // ChargeController's latch rule). null when there's nothing to point to, e.g. no
      // schedule windows configured at all.
      modeTime: function (s) {
        s = s || {};
        var iso = s.mode === 'scheduled' ? s.scheduleEndAt : s.nextScheduleStartAt;
        return iso ? new Date(iso) : null;
      },
      // "→ 2:00pm" next to the mode icon, or '' when modeTime() has nothing to show.
      // Lowercase with no space before am/pm - shorthand, not a clock face.
      modeStatusText: function (s) {
        var d = PF.modeTime(s);
        if (!d) return '';
        var t = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        return '→ ' + t.replace(' ', '').toLowerCase();
      },
      // The small boost badge: only while a scheduled window is actively raising current
      // above its floor right now (see ChargeController.getModeInfo), not merely whenever
      // the window has boost-to-cap enabled.
      showBoost: function (s) {
        s = s || {};
        return s.mode === 'scheduled' && !!s.boostActive;
      },
      // Capacity meter for a tile's edge strip: { pct: 0..1, color } or null to hide it
      // entirely (no configured peak for that node, or - for EV - no charger paired).
      // Peaks are dashboard-only config (ChargeController's resolved limits, passed
      // through verbatim) with no bearing on any control decision.
      meter: function (kind, s) {
        s = s || {};
        var lim = s.limits || {};
        if (kind === 'ev') {
          var c = s.charger || {};
          if (!c.available || !(lim.chargerMaxW > 0)) return null;
          return { pct: Math.max(0, Math.min(1, (c.powerW || 0) / lim.chargerMaxW)), color: 'var(--green)' };
        }
        if (kind === 'solar') {
          if (!(lim.solarPeakW > 0)) return null;
          return { pct: Math.max(0, Math.min(1, (s.solarW || 0) / lim.solarPeakW)), color: 'var(--green)' };
        }
        if (kind === 'battery') {
          var w = s.batteryW || 0;
          var peak = w >= 0 ? lim.batteryChargePeakW : lim.batteryDischargePeakW;
          if (!(peak > 0)) return null;
          return { pct: Math.max(0, Math.min(1, Math.abs(w) / peak)), color: 'var(--purple)' };
        }
        if (kind === 'grid') {
          if (!(lim.gridMaxW > 0)) return null;
          var pct = Math.max(0, Math.min(1, Math.abs(s.gridW || 0) / lim.gridMaxW));
          return { pct: pct, color: pct >= 0.95 ? '#ef4444' : 'var(--purple)' };
        }
        return null;
      },
      // Renders a meter() result (or '' when null/hidden) as the tile-edge strip markup.
      // edge is 'bottom' for the header row (EV/Solar, connector runs below) or 'top' for
      // the device row (Grid/Battery, connector runs above) - see the .meter CSS comment.
      // Width is computed in px, not a plain CSS percentage, to compensate for .tile's own
      // corner clip (overflow:hidden at its border-radius): a corner radius intersecting a
      // thin strip creates a "dead zone" at BOTH ends where the clip saturates - near 0%, a
      // thin sliver is clipped away entirely (confirmed on real hardware: a real ~6.3% grid
      // reading rendered as fully invisible); near 100%, the fill's far edge is *already*
      // past the same clip boundary a true 100% fill hits, so anything above roughly
      // (tileWidth - dead-zone) looks pixel-identical to fully maxed out (confirmed: both
      // 92% and 96% visually indistinguishable from 100%). A hard min/max clamp would just
      // relocate that same collapsing-range problem to a different threshold, so instead any
      // pct in (0,1) is linearly rescaled into [EDGE_PX, TILE_PX-EDGE_PX] - every distinct
      // reading still renders at a distinct, monotonic width - and only the true endpoints
      // (0% genuinely empty, 100% genuinely full, flush into the corner) use the tile's real
      // extent. EDGE_PX (8) clears the dead-zone threshold (1.3px at .meter's 5px height and
      // .tile's 10px radius, r - sqrt(r^2-(r-h)^2) at r=10, h=5) with generous margin, so the
      // gap before 100% - and the sliver above 0% - both read as unmistakable at a glance,
      // not just technically present.
      meterHtml: function (m, edge) {
        if (!m) return '';
        var TILE_PX = 44; // must match .tile's width
        var EDGE_PX = 8;
        var w;
        if (m.pct <= 0) w = 0;
        else if (m.pct >= 1) w = TILE_PX;
        else w = EDGE_PX + m.pct * (TILE_PX - 2 * EDGE_PX);
        return '<div class="meter ' + edge + '"><span style="width:' + Math.round(w)
          + 'px; background:' + m.color + ';"></span></div>';
      },
    };
    // === POWERFLOW-LOGIC-END ===

    function setConn(el, color, f) {
      el.className = 'conn' + (f.dir ? ' active dir-' + f.dir : '');
      el.style.backgroundImage = f.dir
        ? 'repeating-linear-gradient(180deg, ' + color + ' 0 3px, transparent 3px 6px)' : '';
    }

    // Wraps the "kW"/"W" suffix of a PF.fmtW() string in a <span> so it can be de-emphasized.
    // No space character here - the gap between number and unit is .val's own CSS `gap`
    // (sized to the unit's smaller font), not a literal space in the markup.
    function valHtml(w) {
      var str = PF.fmtW(w);
      var i = str.lastIndexOf(' ');
      if (i < 0) return str;
      return str.slice(0, i) + '<span class="unit">' + str.slice(i + 1) + '</span>';
    }

    function render(s) {
      s = s || {};

      var ev = PF.flow('ev', s);
      var solar = PF.flow('solar', s);
      var grid = PF.flow('grid', s);
      var battery = PF.flow('battery', s);
      var house = PF.flow('house', s);

      document.getElementById('ev-tile').innerHTML = ICONS.ev + PF.meterHtml(PF.meter('ev', s), 'bottom');
      document.getElementById('ev-tile').style.color = ev.dir ? ACCENT.ev : ACCENT.inactive;
      document.getElementById('solar-tile').innerHTML = ICONS.solar + PF.meterHtml(PF.meter('solar', s), 'bottom');
      document.getElementById('solar-tile').style.color = solar.dir ? ACCENT.solar : ACCENT.inactive;
      document.getElementById('grid-tile').innerHTML = ICONS.grid + PF.meterHtml(PF.meter('grid', s), 'top');
      document.getElementById('grid-tile').style.color = ACCENT.grid;
      document.getElementById('house-tile').innerHTML = ICONS.house;
      document.getElementById('house-tile').style.color = ACCENT.house;

      var chip = PF.evChip(s);
      var chipEl = document.getElementById('ev-chip');
      if (chip && chip.cls === 'charging') {
        chipEl.innerHTML = ICONS.bolt + Math.round(PF.chargeAmps(s)) + 'A';
      } else {
        chipEl.textContent = chip ? chip.label : '';
      }
      chipEl.className = 'chip' + (chip ? ' ' + chip.cls : '');

      document.getElementById('mode-icon').innerHTML = MODE_ICONS[PF.modeIconKey(s)] || '';
      document.getElementById('mode-time').textContent = PF.modeStatusText(s);
      document.getElementById('mode-boost').innerHTML = PF.showBoost(s) ? ICONS.boost : '';

      document.getElementById('ev-val').innerHTML = valHtml(ev.mag);
      document.getElementById('solar-val').innerHTML = valHtml(solar.mag);
      document.getElementById('grid-val').innerHTML = valHtml(grid.mag);
      document.getElementById('battery-val').innerHTML = valHtml(battery.mag);
      document.getElementById('house-val').innerHTML = valHtml(house.mag);

      var bv = PF.batteryVisual(s.batterySoc);
      document.getElementById('battery-tile').innerHTML = batterySvg(bv) + PF.meterHtml(PF.meter('battery', s), 'top');

      document.getElementById('bus').className = 'bus bus-' + PF.busState(s.gridW);

      // All connectors flow in the same blue regardless of tile — the tile's own accent
      // color (or, for Battery, its charge-tier color) stays on the icon itself.
      setConn(document.getElementById('ev-conn'), 'var(--flow)', ev);
      setConn(document.getElementById('solar-conn'), 'var(--flow)', solar);
      setConn(document.getElementById('grid-conn'), 'var(--flow)', grid);
      setConn(document.getElementById('house-conn'), 'var(--flow)', house);
      setConn(document.getElementById('battery-conn'), 'var(--flow)', battery);
    }

    var CHECK_MS = 5000;   // how often we re-check staleness
    var STALE_MS = 50000;  // dim after ~5 missed pushes (app broadcasts every 10s), then auto-recover
    var lastOkAt = 0;
    var hadData = false;

    function applyStale() {
      var stale = hadData && (Date.now() - lastOkAt > STALE_MS);
      document.querySelector('.card').className = 'card' + (stale ? ' stale' : '');
    }

    function onData(result) {
      if (!result || typeof result !== 'object') return;
      lastOkAt = Date.now(); hadData = true;
      render(result); applyStale();
    }

    function onHomeyReady(Homey) {
      Homey.ready();
      render({});
      // Live data is pushed from the app via realtime events (see startWidgetBroadcast).
      Homey.on('powerflow', onData);
      setInterval(applyStale, CHECK_MS);
    }
  </script>
</body>
</html>
