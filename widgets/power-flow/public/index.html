<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* Homey's own app-level theme setting (Settings > Appearance) is authoritative and can
       differ from the OS's prefers-color-scheme (e.g. app forced to dark while iOS itself is
       in light mode) - the mobile app doesn't propagate that override into the widget's
       WKWebView as prefers-color-scheme, so relying on that media query alone silently
       follows iOS instead of the configured Homey theme. What Homey *does* do is inject its
       own semantic CSS custom properties into the widget document, pre-resolved to the real
       active theme regardless of the OS (--homey-text-color et al; see
       https://apps.developer.homey.app/the-basics/widgets/styling) - `.homey-dark-mode` from
       that same doc is a separate, opt-in class for forcing dark mode, not something Homey
       sets automatically, so it's not usable for detection. Text/background/de-emphasized-text
       colors below reference --homey-text-color/--homey-background-color/--homey-text-color-light
       directly (no local alias, no fallback), so they're unstyled outside the Homey app (e.g.
       these preview screenshots). --tile/--conn-static are derived from --homey-text-color
       blended toward --homey-background-color via color-mix rather than hand-tuned per theme,
       so they can never drift out of sync with it again. They're blended toward the background
       color rather than transparent so they stay fully opaque - .tile and .conn rely on that
       opacity to hide the connector's intentional negative-margin bleed under the tile (see
       .hicon .conn / .tcol .conn below); a translucent tile lets that bleed show through into
       the icon instead of stopping at its edge. --meter-track has no such bleed to hide (it's a
       strip painted on top of the already-opaque tile, not something else bleeding under it),
       so it's left blended toward transparent. */
    :root {
      /* Bus gradient reflects live grid state: importing (drawing from the grid), exporting
         (feeding it), or neutral (no meaningful grid flow). Same tones in both themes — these
         are status colors, not surface colors. */
      --bus-import-a: #ef4444; --bus-import-b: #f59e0b;
      --bus-export-a: #16a34a; --bus-export-b: #22c55e;
      --bus-neutral-a: #8b5cf6; --bus-neutral-b: #c4b5fd;
    }
    :root {
      --tile: color-mix(in srgb, var(--homey-text-color) 13%, var(--homey-background-color));
      --conn-static: color-mix(in srgb, var(--homey-text-color) 9%, var(--homey-background-color));
      --meter-track: color-mix(in srgb, var(--homey-text-color) 15%, transparent);
    }

    * { box-sizing: border-box; }
    /* overflow:hidden guards against the widget frame ever being given less height than
       widget.compose.json declares (title bar, grid rounding, etc.) - without it, any excess
       content shows as a visible scrollbar, which reads as "not a native widget" next to
       Homey's own frame (rounded corners, no scroll chrome). At the declared 226px this is a
       no-op today; it only clips in that mismatch case instead of scrolling. */
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    /* font-family comes from .homey-text-regular on <body> (see markup) - no local stack. */
    body { color: var(--homey-text-color); -webkit-font-smoothing: antialiased; }
    /* Padding follows Homey's `.homey-widget` convention (--homey-su-4, a uniform 16px) instead
       of a hand-tuned asymmetric value - see https://apps.developer.homey.app/the-basics/widgets/styling.
       No literal fallback: relies on Homey's own injected variable, same as the .homey-text-*
       classes elsewhere in this file - won't be sized outside the Homey app (e.g. these preview
       screenshots). */
    .card { padding: var(--homey-su-4); transition: opacity .5s ease, filter .5s ease; }
    /* Stale: data hasn't refreshed recently (network/wifi blip). Dim, keep last values, auto-recover. */
    .card.stale { opacity: 0.4; filter: grayscale(0.85); }

    @keyframes flowDown { from { background-position: 0 0; } to { background-position: 0 6px; } }
    @keyframes flowUp { from { background-position: 0 0; } to { background-position: 0 -6px; } }

    /* Header row: Solar (left) / EV (right). Icons are pinned at fixed x-positions (25%/75%
       of the row) via absolute positioning instead of being centered together with their
       value text in a shrink-wrapped flex group — otherwise the icon shifts sideways every
       time the value's digit count changes width. Text is anchored to the same fixed point
       and grows outward (away from center), so it never pushes the icon either. */
    .headrow { position: relative; height: 78px; }
    .hicon { display: flex; flex-direction: column; align-items: center; gap: var(--homey-su-1);
             position: absolute; top: 0; }
    .hcol.solar .hicon { left: 25%; transform: translateX(-50%); }
    .hcol.ev .hicon { left: 75%; transform: translateX(-50%); }
    /* top:0 (not a translateY(-50%) center) plus an explicit height matching .tile's own
       44px, with justify-content:center centering the 2-line content block within that
       band - not a translateY trick, so it holds regardless of gap. Both .htext and
       .mode-stack use the same top/height/gap, so their content centers identically and
       each line lines up with its counterpart in the other stack (.lbl with .chip, .val
       with .mode-row) - not just the block as a whole. Both children still need an
       explicit height (not line-height) for that gap math to be deterministic: mixing two
       font-sizes on one line (e.g. .val's bold number next to its smaller .unit span)
       makes the browser's own line-box taller than a specified line-height, so line-height
       alone doesn't actually clamp the rendered height - confirmed via
       getBoundingClientRect (a 20px line-height still measured 23px tall). */
    .htext { display: flex; flex-direction: column; justify-content: center; gap: var(--homey-su-1);
             height: 44px; position: absolute; top: 0; }
    .hcol.solar .htext { right: calc(75% + 30px); align-items: flex-end; }
    .hcol.ev .htext { left: calc(75% + 30px); align-items: flex-start; }

    /* position:relative (no z-index needed) lifts tiles and the bus into the positioned
       paint layer, so they're always drawn over the plain in-flow connectors — letting a
       connector's negative margin overlap *underneath* a tile/bus regardless of DOM order,
       for a seamless bleed instead of a visible gap. overflow:hidden clips the capacity
       .meter strip (see below) to the tile's own rounded corners, so it bleeds flush to the
       edge without needing to duplicate the radius on the strip itself. */
    .tile { width: 44px; height: 44px; border-radius: var(--homey-border-radius-default);
            flex: 0 0 auto; position: relative;
            display: grid; place-items: center; background: var(--tile); overflow: hidden; }
    .tile svg { display: block; }

    /* Capacity meter: a full-bleed strip flush to the tile edge nearest its connector
       (bottom for EV/Solar in the header row, top for Grid/Battery in the device row -
       see PF.meter/meterHtml), not a floating inset bar. Appended into the tile's own
       innerHTML each render (see render()) since the icon markup already replaces it
       wholesale every tick. The strip's own width is pixel-rescaled in PF.meterHtml, not
       a plain CSS percentage, to compensate for .tile's corner clip - see there. */
    .meter { position: absolute; left: 0; right: 0; height: 5px; background: var(--meter-track); }
    .meter.top { top: 0; }
    .meter.bottom { bottom: 0; }
    .meter > span { display: block; height: 100%; }

    /* No border-radius: both ends always bleed under an opaque .tile/.bus (10px/6px overlap,
       both well past this element's own end), so any corner rounding here would never
       actually render as a visible curve. */
    .conn { width: 5px; height: 40px; flex: 0 0 auto;
            background-color: var(--conn-static); background-size: 100% 6px; }
    .hicon .conn { margin: -10px 0 0; }  /* bleeds up into the tile above it */
    .tcol .conn { margin: 0 0 -10px; }   /* bleeds down into the tile below it */
    /* Duration deliberately left out of this shorthand - it's set per-element via
       animation-duration inline style (see setConn/PF.connSpeed), scaled by flow rate. */
    .conn.active.dir-down { animation-name: flowDown; animation-timing-function: linear; animation-iteration-count: infinite; }
    .conn.active.dir-up { animation-name: flowUp; animation-timing-function: linear; animation-iteration-count: infinite; }

    /* align-items:baseline (not center) so the smaller .unit span sits on the same text
       baseline as the number, not vertically centered against it - the explicit height
       still keeps the box itself deterministic (see .htext comment). No CSS `gap` here -
       the number-to-unit space is a literal character inside .unit (see PF.valHtml()), so it
       renders at the unit's own smaller font-size instead of a fixed pixel gap. Homey's docs
       pair --homey-font-size-large with --homey-line-height-large (28px), but that's not
       reachable here: .htext is a fixed-44px flex column, so a stated height of 28px (which
       would push lbl+gap+val to 48px) just gets shrunk back down by the browser's default
       flex-shrink - and per the .htext comment, mixed font-sizes on this line (the number
       plus .unit's smaller one) already make a plain line-height unreliable as a height clamp
       even before that. 24px is the actual measured floor (confirmed via
       getBoundingClientRect, same method as the .htext comment) - set explicitly, matching
       that constraint instead of the unreachable spec value. */
    .val { display: flex; align-items: baseline; height: 24px; font-variant-numeric: tabular-nums;
           font-size: var(--homey-font-size-large); font-weight: var(--homey-font-weight-medium); }
    .val .unit { color: var(--homey-text-color-light); } /* de-emphasized so the number reads first; size/weight via .homey-text-small-light */
    /* Explicit height (not line-height/padding) gives .lbl the same rendered height as
       .chip, so the two align by center - see .mode-stack and the .htext comment above on
       why this can't just be line-height. Font-size/weight via .homey-text-small-light on the element. */
    .lbl { display: flex; align-items: center; height: 16px; color: var(--homey-text-color-light); text-transform: uppercase; }

    .tile-wrap { position: relative; }

    /* EV chip + mode icon/shorthand status, stacked to the left of the EV icon (chip on
       top, icon+time beneath - mirrors .htext's label-above-value order). Same
       top/height/gap as .htext (see there) so the chip lines up with the label on the
       other side, and the icon+time row lines up with the power value, regardless of the
       chip's content (READY / UNPLUGGED / CHARGING <amps>A - always 16px tall, see .chip). */
    .mode-stack { position: absolute; right: 100%; top: 0; margin-right: var(--homey-su-2); height: 44px;
                  display: flex; flex-direction: column; justify-content: center;
                  align-items: flex-end; gap: var(--homey-su-1); }
    /* align-items:center (not baseline) - mode-icon/boost-icon are SVGs with no text baseline
       of their own, so under align-items:baseline they'd default to their bottom edge as their
       baseline, sitting them too high (a 16px/14px icon anchored at the text's baseline extends
       well above its cap-height, unlike a glyph); center keeps icons and .mode-time mutually
       level with each other, which is the relationship that actually matters within this row.
       Height matches .val's own height (24px, see there) so .htext/.mode-stack's shared
       lbl+gap+val / chip+gap+mode-row sums stay equal - otherwise centering each stack
       independently within the same 44px band would land .val and .mode-row at different
       offsets instead of level with each other. That still leaves the row as a *group* sitting
       a few px higher than .val's own baseline (pulled down by .val's large-font number - a
       small font's natural centered position in a fixed-height row isn't the same spot a larger
       font's baseline lands it at), so the whole row is nudged down via position:relative below
       - see there for why that, and not a mechanism internal to the row, is what's shifted. */
    .mode-row { display: flex; align-items: center; gap: var(--homey-su-1); height: 24px;
                position: relative; top: 2px; }
    /* Shifts the icon+text+boost group as a unit (position:relative, not margin-top - margin
       would grow .mode-stack's flex content past its fixed 44px height, and justify-content:
       center would then re-center that taller block, quietly pulling .chip away from its own
       still-unshifted counterpart .lbl on the other side of the header row) down to read level
       with .val .unit, without disturbing the icons' and .mode-time's alignment with each
       other (see .mode-row above) - 2px is empirical (measured via getBoundingClientRect, then
       nudged 1px up off that measurement per visual review, not derived from a font metric),
       because the actual gap comes from two different fonts each finding their own "centered"
       position in an equal-height row, which has no closed-form relationship to nudge by
       instead. Real Homey fonts aren't available outside `homey app run` (see homey-mock.css's
       own caveat), so this may need re-tuning once verified on-device. */
    .mode-icon { width: var(--homey-icon-size-regular); height: var(--homey-icon-size-regular); color: var(--homey-text-color); align-self: center; }
    .mode-icon svg { display: block; width: 100%; height: 100%; }
    .mode-icon:empty { display: none; }
    /* "→ 2:00pm" - the mode's next relevant transition (schedule window end while
       Scheduled, else the next window start). Empty (no schedule configured) collapses
       to zero width on its own, same as .mode-icon:empty. Styled to match .val .unit
       (small/muted) rather than .val itself - it's a secondary hint, not a metric.
       position:relative + top:1px nudges its own paint position only - unlike .mode-row's
       shift (which moves the icon/time/boost-icon group as one unit, see there), this doesn't
       consume layout space, so .mode-icon/.boost-icon's align-items:center position in the row
       is untouched. */
    .mode-time { white-space: nowrap; color: var(--homey-text-color-light); position: relative; top: 1px; } /* size/weight via .homey-text-small-light */
    .boost-icon { width: var(--homey-icon-size-small); height: var(--homey-icon-size-small); color: var(--homey-color-orange); align-self: center; }
    .boost-icon svg { display: block; width: 100%; height: 100%; }
    .boost-icon:empty { display: none; }

    /* EV state chip - always a single text label (READY / UNPLUGGED / CHARGING <amps>A).
       Explicit height (not line-height/padding) matches .lbl's for center-alignment - see
       .mode-stack. */
    /* Font-size/weight via .homey-text-small on the element (see markup / chipEl.className below). */
    .chip { display: inline-flex; align-items: center; height: 16px; white-space: nowrap;
            text-transform: uppercase; padding: 0 var(--homey-su-1); position: relative; }
    .chip:empty { display: none; }
    /* text-transform:uppercase text has no descenders, but align-items:center still centers the
       *font's* full ascent/descent line box, not the glyph ink - the unused descender reserve is
       bigger than the unused ascent-to-cap-height reserve for most fonts, so the ink sits high
       within the chip's own layout box. The layout box itself is deliberately NOT renudged to
       fix this: .lbl has the identical uppercase/centered setup and the same unaddressed
       asymmetry, so nudging .chip's *text* (tried at both 2px and 1px) made it visibly sit lower
       than .lbl on the other side of the row. Instead the background pill is painted by
       ::before, detached from .chip's own box, and nudged up to re-center the *visible pill* on
       the ink without moving the text (and therefore without touching the .lbl alignment above)
       - the asymmetry was only ever a paint-layer problem. The nudge amount is font-dependent
       and was retuned from ~0.25px to 1.25px after a real-device (Homey app, not this repo's
       dev-only preview harness) screenshot showed the on-device font's descent reserve is much
       larger relative to its ascent than the desktop system font this was first tuned against -
       these values were read off real-device screenshots, not independently derived, so may
       still want another pass. top/bottom aren't equal-and-opposite: after the 1.25px symmetric
       version was confirmed close on real hardware, a further real-device check asked for a bit
       more room specifically below the text, so only `bottom` moved (1.25px → 0.75px, i.e. the
       pill's bottom edge extended 0.5px further down) while `top` stayed put - this is purely the
       ::before pseudo's own paint box, absolutely positioned and thus outside layout flow, so
       growing it doesn't push .mode-row (icon/time/boost-icon) below it in .mode-stack down. */
    .chip::before { content: ''; position: absolute; left: 0; right: 0; top: -1.25px; bottom: 0.75px;
                     border-radius: var(--homey-border-radius-default); z-index: -1;
                     background: color-mix(in srgb, currentColor 18%, transparent); }
    .chip.charging { color: var(--homey-color-green); }
    .chip.ready { color: var(--homey-color-blue-600); }
    .chip.unplugged { color: var(--homey-text-color-light); }

    /* Power bus: negative top/bottom margins pull it into both rows' connectors. Gradient
       reflects live grid state (see PF.busState). */
    .bus { height: 6px; border-radius: var(--homey-border-radius-small); margin: -6px 2px -6px; position: relative;
           transition: background .4s ease; }
    .bus.bus-import { background: linear-gradient(90deg, var(--bus-import-a), var(--bus-import-b)); }
    .bus.bus-export { background: linear-gradient(90deg, var(--bus-export-a), var(--bus-export-b)); }
    .bus.bus-neutral { background: linear-gradient(90deg, var(--bus-neutral-a), var(--bus-neutral-b)); }

    /* Device tile row: Grid / Battery / House */
    .tilerow { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--homey-su-2); }
    .tcol { display: flex; flex-direction: column; align-items: center; gap: var(--homey-su-1); }
    /* Value-to-label gap kept separate from the icon-to-value gap above (.tcol's own gap) so
       it can be tuned independently - bottom row only (.lbl/.val themselves are shared with
       the header row's .htext, so they stay untouched). gap:0 here, not su-1 - .val's own
       box (baseline-aligned, sized for a large font with no descenders in play) already
       reserves a few px below the digits, and .lbl's line box reserves ~1-2px above its
       capital letters even at gap:0 (confirmed via Range.getBoundingClientRect on the
       glyphs, not just the boxes) - an explicit gap on top of both left visibly more
       whitespace here than the icon-to-value gap above it. */
    .tcol-text { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: var(--homey-su-1); }
  </style>
</head>
<body class="homey-text-regular">
  <div class="card homey-widget">
    <div class="headrow">
      <div class="hcol solar">
        <div class="hicon">
          <div class="tile" id="solar-tile"></div>
          <div class="conn" id="solar-conn"></div>
        </div>
        <div class="htext">
          <div class="lbl homey-text-small-light">Solar</div>
          <div class="val" id="solar-val">–</div>
        </div>
      </div>
      <div class="hcol ev">
        <div class="htext">
          <div class="lbl homey-text-small-light">EV</div>
          <div class="val" id="ev-val">–</div>
        </div>
        <div class="hicon">
          <div class="tile-wrap">
            <div class="tile" id="ev-tile"></div>
            <div class="mode-stack">
              <div class="chip" id="ev-chip"></div>
              <div class="mode-row">
                <div class="mode-icon" id="mode-icon"></div>
                <div class="mode-time homey-text-small-light" id="mode-time"></div>
                <div class="boost-icon" id="mode-boost"></div>
              </div>
            </div>
          </div>
          <div class="conn" id="ev-conn"></div>
        </div>
      </div>
    </div>

    <div class="bus" id="bus"></div>

    <div class="tilerow">
      <div class="tcol homey-text-align-center">
        <div class="conn" id="grid-conn"></div>
        <div class="tile" id="grid-tile"></div>
        <div class="tcol-text">
          <div class="val" id="grid-val">–</div>
          <div class="lbl homey-text-small-light">Grid</div>
        </div>
      </div>
      <div class="tcol homey-text-align-center">
        <div class="conn" id="battery-conn"></div>
        <div class="tile" id="battery-tile"></div>
        <div class="tcol-text">
          <div class="val" id="battery-val">–</div>
          <div class="lbl homey-text-small-light">Battery</div>
        </div>
      </div>
      <div class="tcol homey-text-align-center">
        <div class="conn" id="house-conn"></div>
        <div class="tile" id="house-tile"></div>
        <div class="tcol-text">
          <div class="val" id="house-val">–</div>
          <div class="lbl homey-text-small-light">House</div>
        </div>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    var ICONS = {
      ev: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-3.5a1 1 0 0 1 .4-.8l2.2-1.7a2 2 0 0 1 1.2-.4h8.4a2 2 0 0 1 1.2.4l2.2 1.7a1 1 0 0 1 .4.8V16"/><path d="M3 16h18"/><path d="M6 10.5 7.5 6.5A1.5 1.5 0 0 1 9 5.5h6a1.5 1.5 0 0 1 1.5 1l1.5 4"/><circle cx="7.5" cy="16.3" r="1.6"/><circle cx="16.5" cy="16.3" r="1.6"/></svg>',
      solar: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M3 8h18M3 12h18M9 4v12M15 4v12"/><path d="M9 20l1.5-4M15 20l-1.5-4"/></svg>',
      grid: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 20M12 2L5 22M9 22l1.5-6h3L15 22"/><path d="M7 14h10M8.3 8h7.4"/></svg>',
      house: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 9.5V21h14V9.5"/></svg>',
      // Small "boost active" badge, shown next to the clock icon in scheduled mode.
      boost: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5-5 5 5"/><path d="M7 9l5-5 5 5"/></svg>',
    };
    // Mode icons: which derived mode is currently driving the charger, and (for solar)
    // whether there's currently enough excess to actually charge on it.
    var MODE_ICONS = {
      'solar-enough': '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
      'solar-low': '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="4.5"/><path d="M8 0.5v2M2.5 3.5l1.4 1.4M0.5 9h2"/><path d="M9 20.5h10.5a4 4 0 0 0 .4-7.96 5 5 0 0 0-9.6-1.7A4.3 4.3 0 0 0 9 20.5Z"/></svg>',
      scheduled: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
      manual: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="4" x2="6" y2="20"/><circle cx="6" cy="9" r="2" fill="currentColor" stroke="none"/><line x1="12" y1="4" x2="12" y2="20"/><circle cx="12" cy="15" r="2" fill="currentColor" stroke="none"/><line x1="18" y1="4" x2="18" y2="20"/><circle cx="18" cy="7" r="2" fill="currentColor" stroke="none"/></svg>',
      idle: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="9.5" y1="9" x2="9.5" y2="15"/><line x1="14.5" y1="9" x2="14.5" y2="15"/></svg>',
    };
    function batterySvg(v) {
      return '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="' + v.color + '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="7" y="4" width="10" height="17" rx="2.5"/>' +
        '<rect x="10.5" y="1.5" width="3" height="2.5" rx="1" fill="' + v.color + '" stroke="none"/>' +
        '<rect x="8.5" y="' + v.fillY + '" width="7" height="' + v.fillHeight + '" rx="1" fill="' + v.color + '" stroke="none"/>' +
        '</svg>';
    }

    // House shares Grid's blue-600, and EV/Solar fall back to that same blue-600 when idle.
    var ACCENT = { ev: 'var(--homey-color-green)', solar: 'var(--homey-color-green)', grid: 'var(--homey-color-blue-600)', house: 'var(--homey-color-blue-600)', inactive: 'var(--homey-color-blue-600)' };

    // === POWERFLOW-LOGIC-START (inlined so the widget is self-contained; the test
    // suite extracts this exact block, so keep it dependency-free) ===
    var PF = {
      fmtW: function (w) {
        if (w == null || isNaN(w)) return '–';
        var a = Math.abs(w);
        if (a >= 1000) return (w / 1000).toFixed(1).replace(/\.0$/, '') + ' kW';
        return Math.round(w) + ' W';
      },
      cap: function (s) { return s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : ''; },
      // { mag, dir: 'up'|'down'|null } — dir picks the flowDown/flowUp keyframe, i.e. which way
      // the dash pattern visually scrolls along the connector, not an abstract "into the bus"
      // label. EV/Solar sit in the header row, above the bus, so their connector runs icon→bus
      // top-to-bottom; Grid/Battery/House sit in the tile row, below the bus, so theirs runs
      // bus→icon top-to-bottom. A source (feeds the bus) therefore animates 'down' when it's
      // above the bus (Solar) but 'up' when it's below (discharging Battery, exporting Grid);
      // a sink (draws from the bus) is the mirror: 'up' above the bus (EV), 'down' below it
      // (House, charging Battery, importing Grid).
      flow: function (kind, s) {
        s = s || {};
        var w;
        if (kind === 'ev') {
          var c = s.charger || {};
          w = c.available ? (c.powerW || 0) : 0;
          return { mag: w, dir: w > 10 ? 'up' : null };
        }
        if (kind === 'solar') { w = s.solarW || 0; return { mag: w, dir: w > 10 ? 'down' : null }; }
        if (kind === 'house') { w = s.houseW || 0; return { mag: w, dir: w > 10 ? 'down' : null }; }
        if (kind === 'battery') { w = s.batteryW || 0; return { mag: Math.abs(w), dir: w > 10 ? 'down' : (w < -10 ? 'up' : null) }; }
        if (kind === 'grid') { w = s.gridW || 0; return { mag: Math.abs(w), dir: w > 10 ? 'up' : (w < -10 ? 'down' : null) }; }
        return { mag: 0, dir: null };
      },
      // Dynamic battery glyph: outline stays fixed, fill rect scales/recolors by charge tier.
      batteryVisual: function (pct) {
        if (pct == null || isNaN(pct)) return { color: 'var(--homey-color-mono-500)', fillHeight: 2, fillY: 17 };
        var color, frac;
        if (pct <= 5) { color = 'var(--homey-color-red)'; frac = 0; }
        else if (pct <= 25) { color = 'var(--homey-color-orange)'; frac = 0.25; }
        else if (pct <= 50) { color = 'color-mix(in srgb, var(--homey-color-red), var(--homey-color-green))'; frac = 0.5; } // no Homey yellow token - blended as a stand-in
        else if (pct <= 75) { color = 'var(--homey-color-orange)'; frac = 0.75; }
        else { color = 'var(--homey-color-green)'; frac = 1; }
        var maxFill = 13;
        var fillHeight = frac === 0 ? 2 : maxFill * frac;
        var fillY = 6 + (maxFill - fillHeight);
        return { color: color, fillHeight: fillHeight, fillY: fillY };
      },
      // Which gradient the power bus should show, using the same +-10W deadband as flow().
      busState: function (gridW) {
        gridW = gridW || 0;
        if (gridW > 10) return 'import';
        if (gridW < -10) return 'export';
        return 'neutral';
      },
      // EV status chip, from the same evcharger_charging_state enum Homey's own UI uses
      // (computed once in ChargeController.toChargingState, just passed through here).
      // Charging carries no label - the render layer fills it with a "CHARGING" label +
      // live amps (via chargeAmps) instead of a static one.
      evChip: function (s) {
        s = s || {};
        var c = s.charger || {};
        if (!c.available) return null;
        if (c.chargingState === 'plugged_in_charging') return { cls: 'charging' };
        if (c.chargingState === 'plugged_in') return { label: 'READY', cls: 'ready' };
        if (c.chargingState === 'plugged_out') return { label: 'UNPLUGGED', cls: 'unplugged' };
        return null;
      },
      // Commanded charge current, shown in the EV chip while charging. charge_current_limit
      // is a target the controller only rewrites on a fresh positive value (see
      // ChargeController) - it does *not* reset to 0 on pause - so paused/not-actively-
      // charging is gated here instead of trusting the raw capability value.
      chargeAmps: function (s) {
        s = s || {};
        var c = s.charger || {};
        if (!c.available || c.chargingState !== 'plugged_in_charging') return 0;
        return c.limitA != null ? c.limitA : 0;
      },
      // Which icon represents the current mode - solar splits into two glyphs depending on
      // whether there's currently enough excess to actually charge on it.
      modeIconKey: function (s) {
        s = s || {};
        if (s.mode === 'scheduled') return 'scheduled';
        if (s.mode === 'manual') return 'manual';
        if (s.mode === 'solar') return s.solarEnough ? 'solar-enough' : 'solar-low';
        if (s.mode === 'idle') return 'idle';
        return null;
      },
      // The Date the mode's shorthand status should point to: the active window's end while
      // Scheduled (it's already running - what matters is when it stops), otherwise the next
      // schedule window's start (also the moment a manual override auto-clears, per
      // ChargeController's latch rule). null when there's nothing to point to, e.g. no
      // schedule windows configured at all.
      modeTime: function (s) {
        s = s || {};
        var iso = s.mode === 'scheduled' ? s.scheduleEndAt : s.nextScheduleStartAt;
        return iso ? new Date(iso) : null;
      },
      // "→ 2:00pm" next to the mode icon, or '' when modeTime() has nothing to show.
      // Lowercase with no space before am/pm - shorthand, not a clock face.
      modeStatusText: function (s) {
        var d = PF.modeTime(s);
        if (!d) return '';
        var t = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        return '→ ' + t.replace(' ', '').toLowerCase();
      },
      // The small boost badge: only while a scheduled window is actively raising current
      // above its floor right now (see ChargeController.getModeInfo), not merely whenever
      // the window has boost-to-cap enabled.
      showBoost: function (s) {
        s = s || {};
        return s.mode === 'scheduled' && !!s.boostActive;
      },
      // Capacity meter for a tile's edge strip: { pct: 0..1, color } or null to hide it
      // entirely (no configured peak for that node, or - for EV - no charger paired).
      // Peaks are dashboard-only config (ChargeController's resolved limits, passed
      // through verbatim) with no bearing on any control decision.
      meter: function (kind, s) {
        s = s || {};
        var lim = s.limits || {};
        if (kind === 'ev') {
          var c = s.charger || {};
          if (!c.available || !(lim.chargerMaxW > 0)) return null;
          return { pct: Math.max(0, Math.min(1, (c.powerW || 0) / lim.chargerMaxW)), color: 'var(--homey-color-green)' };
        }
        if (kind === 'solar') {
          if (!(lim.solarPeakW > 0)) return null;
          return { pct: Math.max(0, Math.min(1, (s.solarW || 0) / lim.solarPeakW)), color: 'var(--homey-color-green)' };
        }
        if (kind === 'battery') {
          var w = s.batteryW || 0;
          var peak = w >= 0 ? lim.batteryChargePeakW : lim.batteryDischargePeakW;
          if (!(peak > 0)) return null;
          return { pct: Math.max(0, Math.min(1, Math.abs(w) / peak)), color: 'var(--homey-color-blue-600)' };
        }
        if (kind === 'grid') {
          if (!(lim.gridMaxW > 0)) return null;
          var pct = Math.max(0, Math.min(1, Math.abs(s.gridW || 0) / lim.gridMaxW));
          return { pct: pct, color: pct >= 0.95 ? 'var(--homey-text-color-danger)' : 'var(--homey-color-blue-600)' };
        }
        return null;
      },
      // The largest single connector magnitude currently on the diagram (W) - the
      // reference every connector's share is measured against in connSpeed(). Deliberately
      // the max of the five flows, not total generation/consumption on either side of the
      // bus: that guarantees exactly one connector always reads as "full speed" at any
      // instant, so the diagram never reads as universally sluggish just because power is
      // spread across several sources/sinks at once.
      maxFlowW: function (s) {
        var kinds = ['ev', 'solar', 'grid', 'battery', 'house'];
        var max = 0;
        for (var i = 0; i < kinds.length; i++) {
          var m = PF.flow(kinds[i], s).mag;
          if (m > max) max = m;
        }
        return max;
      },
      // Connector dash-scroll animation duration (seconds), driven by each connector's
      // *share of the busiest flow on the diagram right now* - not, as before, its own
      // power as a fraction of its own configured capacity (that's already what the
      // tile-edge capacity meter shows via meter()/meterHtml(); using it for speed too was
      // redundant, and left House - which has no meter - and any node with an unset peak
      // permanently animating at the flat default). Duration follows FAST_S / share^POWER -
      // a curve, not a straight line, so it reads as more clearly "busy vs. idle" at a
      // glance - fit through three named reference points: share 1.0 -> FAST_S, share
      // MIN_RATE -> SLOW_S, and share 0 (nothing flowing) treated as MIN_RATE too rather
      // than a divide-by-zero. POWER is derived below from FAST_S/SLOW_S/MIN_RATE, so
      // retuning the animation (as has happened more than once) only ever means editing
      // those three values directly, never re-deriving the curve by hand.
      //
      // MIN_RATE (not MID_S) is the third tunable, deliberately: the alternative - fixing
      // the share-0.5 duration instead - sounds more intuitive, but it locks POWER (the
      // curve's steepness) to whatever ratio FAST_S:that duration implies, which pushes
      // MIN_RATE whichever way that ratio happens to demand (concretely, FAST_S=0.25s /
      // 0.75s-at-50%-share / SLOW_S=3s previously forced MIN_RATE up to ~21% - a needlessly
      // steep curve where every connector under ~21% share looked identically "slowest",
      // e.g. no visible difference between a 5% and a 19% flow). Setting MIN_RATE directly
      // instead means it's never an accidental side effect of the other two - lower it here
      // to spread the low end out further; the 50%-share duration is a read-only side
      // effect of these three, not the other way around. e.g. solar 1kW + grid 1kW feeding
      // a 2kW house: house is the busiest flow (share 1.0, FAST_S), solar and grid each
      // carry half the house's magnitude - a share still well above MIN_RATE, so each gets
      // its own distinct duration, not the same clamped SLOW_S.
      connSpeed: function (kind, s) {
        var FAST_S = 0.25;
        var SLOW_S = 3.0;
        var MIN_RATE = 0.10;
        var POWER = Math.log(FAST_S / SLOW_S) / Math.log(MIN_RATE);
        var max = PF.maxFlowW(s);
        var share = max > 0 ? PF.flow(kind, s).mag / max : 0;
        share = Math.max(MIN_RATE, Math.min(1, share));
        return FAST_S / Math.pow(share, POWER);
      },
      // Renders a meter() result (or '' when null/hidden) as the tile-edge strip markup.
      // edge is 'bottom' for the header row (EV/Solar, connector runs below) or 'top' for
      // the device row (Grid/Battery, connector runs above) - see the .meter CSS comment.
      // Width is computed in px, not a plain CSS percentage, to compensate for .tile's own
      // corner clip (overflow:hidden at its border-radius): a corner radius intersecting a
      // thin strip creates a "dead zone" at BOTH ends where the clip saturates - near 0%, a
      // thin sliver is clipped away entirely (confirmed on real hardware: a real ~6.3% grid
      // reading rendered as fully invisible); near 100%, the fill's far edge is *already*
      // past the same clip boundary a true 100% fill hits, so anything above roughly
      // (tileWidth - dead-zone) looks pixel-identical to fully maxed out (confirmed: both
      // 92% and 96% visually indistinguishable from 100%). A hard min/max clamp would just
      // relocate that same collapsing-range problem to a different threshold, so instead any
      // pct in (0,1) is linearly rescaled into [EDGE_PX, TILE_PX-EDGE_PX] - every distinct
      // reading still renders at a distinct, monotonic width - and only the true endpoints
      // (0% genuinely empty, 100% genuinely full, flush into the corner) use the tile's real
      // extent. EDGE_PX (5) clears the dead-zone threshold (1.3px at .meter's 5px height and
      // .tile's 10px radius, r - sqrt(r^2-(r-h)^2) at r=10, h=5) with ~3.7x margin - enough
      // that the sliver above 0% and the gap before 100% both stay unmistakable, without
      // overstating a genuinely low reading by inflating it toward a much bigger floor than
      // the geometry actually requires. Symmetric by construction: the same EDGE_PX buffers
      // both ends identically, so tightening/loosening it never favors one end over the other.
      meterHtml: function (m, edge) {
        if (!m) return '';
        var TILE_PX = 44; // must match .tile's width
        var EDGE_PX = 5;
        var w;
        if (m.pct <= 0) w = 0;
        else if (m.pct >= 1) w = TILE_PX;
        else w = EDGE_PX + m.pct * (TILE_PX - 2 * EDGE_PX);
        return '<div class="meter ' + edge + '"><span style="width:' + Math.round(w)
          + 'px; background:' + m.color + ';"></span></div>';
      },
      // Wraps the "kW"/"W" suffix of an fmtW() string in a <span> so it can be
      // de-emphasized. The separating space is placed inside that span (not as a CSS gap
      // on .val) so it renders at the unit's own smaller font-size rather than the
      // number's - and it has to be `&nbsp;`, not a plain space: .val is a flex container,
      // and .unit (a flex item) trims a leading *collapsible* space from its own content
      // the same way a block box would, so a literal " " was silently disappearing.
      // &nbsp; isn't collapsible, so it survives. Used only for the primary power
      // value/unit text (EV/Solar/Grid/Battery/House's .val) - not the EV chip's amps
      // text or any other unit-like text.
      valHtml: function (w) {
        var str = PF.fmtW(w);
        var i = str.lastIndexOf(' ');
        if (i < 0) return str;
        return str.slice(0, i) + '<span class="unit homey-text-small-light">&nbsp;' + str.slice(i + 1) + '</span>';
      },
    };
    // === POWERFLOW-LOGIC-END ===

    function setConn(el, color, f, speedS) {
      el.className = 'conn' + (f.dir ? ' active dir-' + f.dir : '');
      el.style.backgroundImage = f.dir
        ? 'repeating-linear-gradient(180deg, ' + color + ' 0 3px, transparent 3px 6px)' : '';
      el.style.animationDuration = f.dir ? speedS + 's' : '';
    }

    function render(s) {
      s = s || {};

      var ev = PF.flow('ev', s);
      var solar = PF.flow('solar', s);
      var grid = PF.flow('grid', s);
      var battery = PF.flow('battery', s);
      var house = PF.flow('house', s);

      document.getElementById('ev-tile').innerHTML = ICONS.ev + PF.meterHtml(PF.meter('ev', s), 'bottom');
      document.getElementById('ev-tile').style.color = ev.dir ? ACCENT.ev : ACCENT.inactive;
      document.getElementById('solar-tile').innerHTML = ICONS.solar + PF.meterHtml(PF.meter('solar', s), 'bottom');
      document.getElementById('solar-tile').style.color = solar.dir ? ACCENT.solar : ACCENT.inactive;
      document.getElementById('grid-tile').innerHTML = ICONS.grid + PF.meterHtml(PF.meter('grid', s), 'top');
      document.getElementById('grid-tile').style.color = ACCENT.grid;
      document.getElementById('house-tile').innerHTML = ICONS.house;
      document.getElementById('house-tile').style.color = ACCENT.house;

      var chip = PF.evChip(s);
      var chipEl = document.getElementById('ev-chip');
      chipEl.textContent = chip ? (chip.cls === 'charging' ? 'CHARGING ' + Math.round(PF.chargeAmps(s)) + 'A' : chip.label) : '';
      chipEl.className = 'chip homey-text-small' + (chip ? ' ' + chip.cls : '');

      document.getElementById('mode-icon').innerHTML = MODE_ICONS[PF.modeIconKey(s)] || '';
      document.getElementById('mode-time').textContent = PF.modeStatusText(s);
      document.getElementById('mode-boost').innerHTML = PF.showBoost(s) ? ICONS.boost : '';

      document.getElementById('ev-val').innerHTML = PF.valHtml(ev.mag);
      document.getElementById('solar-val').innerHTML = PF.valHtml(solar.mag);
      document.getElementById('grid-val').innerHTML = PF.valHtml(grid.mag);
      document.getElementById('battery-val').innerHTML = PF.valHtml(battery.mag);
      document.getElementById('house-val').innerHTML = PF.valHtml(house.mag);

      var bv = PF.batteryVisual(s.batterySoc);
      document.getElementById('battery-tile').innerHTML = batterySvg(bv) + PF.meterHtml(PF.meter('battery', s), 'top');

      document.getElementById('bus').className = 'bus bus-' + PF.busState(s.gridW);

      // All connectors flow in the same blue regardless of tile — the tile's own accent
      // color (or, for Battery, its charge-tier color) stays on the icon itself. Dash-scroll
      // speed is driven by PF.connSpeed (each connector's share of the busiest flow on the
      // diagram right now - see connSpeed's own comment).
      setConn(document.getElementById('ev-conn'), 'var(--homey-color-blue-600)', ev, PF.connSpeed('ev', s));
      setConn(document.getElementById('solar-conn'), 'var(--homey-color-blue-600)', solar, PF.connSpeed('solar', s));
      setConn(document.getElementById('grid-conn'), 'var(--homey-color-blue-600)', grid, PF.connSpeed('grid', s));
      setConn(document.getElementById('house-conn'), 'var(--homey-color-blue-600)', house, PF.connSpeed('house', s));
      setConn(document.getElementById('battery-conn'), 'var(--homey-color-blue-600)', battery, PF.connSpeed('battery', s));
    }

    var CHECK_MS = 5000;   // how often we re-check staleness
    var STALE_MS = 50000;  // dim after ~5 missed pushes (app broadcasts every 10s), then auto-recover
    var lastOkAt = 0;
    var hadData = false;

    function applyStale() {
      var stale = hadData && (Date.now() - lastOkAt > STALE_MS);
      document.querySelector('.card').className = 'card' + (stale ? ' stale' : '');
    }

    function onData(result) {
      if (!result || typeof result !== 'object') return;
      lastOkAt = Date.now(); hadData = true;
      render(result); applyStale();
    }

    // Homey re-invokes onHomeyReady every time this widget (re)mounts - notably when
    // navigating away from a dashboard containing it and back. Registering the realtime
    // listener and stale-check interval unconditionally on every call would stack up one
    // more of each per visit with nothing ever tearing down the previous ones - confirmed
    // as the cause of a whole-dashboard freeze after a few dashboard switches (duplicate
    // onData/applyStale callbacks compounding on every 10s push and 5s check). Guard the
    // listener registration to once per JS context, and always clear any prior interval
    // before starting a new one, so a re-mount can never leave an orphaned timer running.
    var readyListenerAttached = false;
    var staleTimer = null;

    function onHomeyReady(Homey) {
      Homey.ready();
      render({});
      // Live data is pushed from the app via realtime events (see startWidgetBroadcast).
      if (!readyListenerAttached) {
        readyListenerAttached = true;
        Homey.on('powerflow', onData);
      }
      if (staleTimer) clearInterval(staleTimer);
      staleTimer = setInterval(applyStale, CHECK_MS);
    }
  </script>
</body>
</html>
