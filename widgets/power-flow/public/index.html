<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --text: #0b1220;
      --muted: #6b7280;
      --card: #ffffff;
      --tile: rgba(15, 23, 42, 0.05);
      --tile-border: rgba(15, 23, 42, 0.08);
      --hairline: rgba(15, 23, 42, 0.08);
      --solar: #f59e0b;
      --battery: #10b981;
      --house: #3b82f6;
      --grid: #8b5cf6;
      --charger: #16a34a;
      --imp-a: #ef4444; --imp-b: #f97316;
      --exp-a: #16a34a; --exp-b: #22c55e;
      --glow: rgba(0,0,0,0);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f3f4f6; --muted: #94a3b8;
        --card: #0f141b;
        --tile: rgba(255,255,255,0.05);
        --tile-border: rgba(255,255,255,0.09);
        --hairline: rgba(255,255,255,0.10);
        --glow: rgba(34,197,94,0.35);
      }
    }
    :root[data-theme="dark"] {
      --text: #f3f4f6; --muted: #94a3b8; --card: #0f141b;
      --tile: rgba(255,255,255,0.05); --tile-border: rgba(255,255,255,0.09); --hairline: rgba(255,255,255,0.10);
      --glow: rgba(34,197,94,0.35);
    }
    :root[data-theme="light"] {
      --text: #0b1220; --muted: #6b7280; --card: #ffffff;
      --tile: rgba(15,23,42,0.05); --tile-border: rgba(15,23,42,0.08); --hairline: rgba(15,23,42,0.08); --glow: rgba(0,0,0,0);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif; color: var(--text);
           -webkit-font-smoothing: antialiased; }
    .card { padding: 14px 16px 12px; }

    /* Header */
    .head { display: flex; align-items: center; gap: 12px; }
    .head .badge-icon {
      width: 44px; height: 44px; border-radius: 12px; flex: 0 0 auto;
      display: grid; place-items: center; color: var(--charger);
      background: color-mix(in srgb, var(--charger) 14%, transparent);
    }
    .head .htext { flex: 1 1 auto; min-width: 0; }
    .head .title { font-size: 15px; font-weight: 700; line-height: 1.15; }
    .head .status { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
    .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
    .sdot.on { background: var(--exp-b); box-shadow: 0 0 8px var(--exp-b); }
    .sdot.fault { background: var(--imp-a); box-shadow: 0 0 8px var(--imp-a); }
    .head .hpower { text-align: right; }
    .head .hpower .val { font-size: 18px; font-weight: 750; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .head .hpower .amp { font-size: 11px; color: var(--muted); }

    /* Bus bar */
    .bus { height: 4px; border-radius: 999px; margin: 12px 2px 4px;
           background: linear-gradient(90deg, var(--exp-a), var(--exp-b));
           box-shadow: 0 0 12px var(--glow); transition: background .4s ease; }
    .bus.importing { background: linear-gradient(90deg, var(--imp-a), var(--imp-b)); box-shadow: 0 0 12px color-mix(in srgb, var(--imp-a) 45%, transparent); }

    /* Nodes */
    .nodes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .node { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .arrow { height: 16px; display: grid; place-items: center; color: var(--muted); opacity: 0; transition: opacity .3s; }
    .arrow.show { opacity: 1; }
    .arrow.down svg { transform: rotate(180deg); }
    .arrow.show svg { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .arrow.down.show svg { animation: pulseD 1.5s ease-in-out infinite; }
    @keyframes pulseD { 0%,100% { transform: rotate(180deg) translateY(0); } 50% { transform: rotate(180deg) translateY(-2px); } }
    .tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
            border: 1px solid var(--tile-border); background: var(--tile); }
    .node .val { font-size: 14px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .node .name { font-size: 10.5px; color: var(--muted); margin-top: 1px; text-transform: uppercase; letter-spacing: 0.05em; }
    .node .soc { font-size: 10.5px; font-weight: 700; margin-top: 3px; color: var(--battery);
                 background: color-mix(in srgb, var(--battery) 15%, transparent); border-radius: 999px; padding: 1px 7px; line-height: 1.5; }
    .node .soc:empty { display: none; }
    .tile svg, .badge-icon svg, .arrow svg { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="badge-icon" id="charger-tile"></div>
      <div class="htext">
        <div class="title">EV Charger</div>
        <div class="status"><span class="sdot" id="sdot"></span><span id="status">—</span></div>
      </div>
      <div class="hpower">
        <div class="val" id="charger-power">–</div>
        <div class="amp" id="charger-amp"></div>
      </div>
    </div>

    <div class="bus" id="bus"></div>

    <div class="nodes" id="nodes"></div>
  </div>

  <script type="text/javascript">
    var ICONS = {
      charger: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="10" height="18" rx="2"/><line x1="7" y1="7" x2="11" y2="7"/><path d="M10 10.5 L8.3 14 H10 L9 17.5 L11.7 13.3 H9.9 Z" fill="currentColor" stroke="none"/><path d="M14 9 h2.5 a2 2 0 0 1 2 2 v3.5 a2 2 0 0 1 -2 2 h-.5"/></svg>',
      solar: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="11" rx="1"/><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="11.5" x2="21" y2="11.5"/><line x1="9" y1="4" x2="8" y2="15"/><line x1="15" y1="4" x2="16" y2="15"/><line x1="12" y1="15" x2="12" y2="20"/><line x1="8" y1="20" x2="16" y2="20"/></svg>',
      battery: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="10" height="17" rx="2"/><path d="M10 4 V2.5 h4 V4" /><line x1="9.5" y1="9" x2="14.5" y2="9"/><line x1="9.5" y1="12.5" x2="14.5" y2="12.5"/></svg>',
      house: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 L12 4 L20 11"/><path d="M6 9.5 V20 H18 V9.5"/><rect x="10.3" y="14" width="3.4" height="6"/></svg>',
      grid: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21 L12 3 L19 21"/><path d="M12 3 V21"/><path d="M8.7 12 H15.3"/><path d="M7 16.5 H17"/></svg>',
    };
    var CHEV = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15 L12 9 L18 15"/></svg>';

    var ACCENT = { solar: 'var(--solar)', battery: 'var(--battery)', house: 'var(--house)', grid: 'var(--grid)' };
    var NAMES = { solar: 'Solar', battery: 'Battery', house: 'House', grid: 'Grid' };
    var ORDER = ['solar', 'battery', 'house', 'grid'];

    // === POWERFLOW-LOGIC-START (inlined so the widget is self-contained; the test
    // suite extracts this exact block via these markers — keep it dependency-free) ===
    var PF = {
      fmtW: function (w) {
        if (w == null || isNaN(w)) return '–';
        var a = Math.abs(w);
        return a >= 1000 ? (w / 1000).toFixed(a >= 10000 ? 0 : 1) + ' kW' : Math.round(w) + ' W';
      },
      cap: function (s) { return s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : ''; },
      // { mag, dir: 'up'|'down'|null } — up = energy into the home/bus.
      flow: function (kind, s) {
        s = s || {};
        var w;
        if (kind === 'solar') { w = s.solarW || 0; return { mag: w, dir: w > 10 ? 'up' : null }; }
        if (kind === 'house') { w = s.houseW || 0; return { mag: w, dir: w > 10 ? 'down' : null }; }
        if (kind === 'battery') { w = s.batteryW || 0; return { mag: Math.abs(w), dir: w > 10 ? 'down' : (w < -10 ? 'up' : null) }; }
        if (kind === 'grid') { w = s.gridW || 0; return { mag: Math.abs(w), dir: w > 10 ? 'up' : (w < -10 ? 'down' : null) }; }
        return { mag: 0, dir: null };
      },
      busImporting: function (s) { return ((s && s.gridW) || 0) > 10; },
      socLabel: function (s) { var v = s && s.batterySoc; return (v != null && !isNaN(v)) ? Math.round(v) + '%' : ''; },
      statusLabel: function (c) {
        if (!c || !c.available) return 'No charger paired';
        var map = { Charging: 'Charging', SuspendedEV: 'Paused (vehicle)', SuspendedEVSE: 'Paused',
          Preparing: 'Plugged in', Finishing: 'Finishing', Available: 'Unplugged', Faulted: 'Fault',
          Reserved: 'Reserved', Unavailable: 'Unavailable' };
        var s = map[c.status] || PF.cap(c.status) || 'Idle';
        return c.mode ? s + ' · ' + PF.cap(c.mode) : s;
      },
    };
    // === POWERFLOW-LOGIC-END ===

    function buildNodes() {
      var root = document.getElementById('nodes');
      root.innerHTML = ORDER.map(function (k) {
        return '<div class="node" data-k="' + k + '">' +
          '<div class="arrow" data-role="arrow">' + CHEV + '</div>' +
          '<div class="tile" style="color:' + ACCENT[k] + '">' + ICONS[k] + '</div>' +
          '<div class="val" data-role="val">–</div>' +
          '<div class="name">' + NAMES[k] + '</div>' +
          '<div class="soc" data-role="soc"></div>' +
        '</div>';
      }).join('');
      document.getElementById('charger-tile').innerHTML = ICONS.charger;
    }

    function render(s) {
      s = s || {};
      var c = s.charger || {};

      document.getElementById('charger-power').textContent = c.available ? PF.fmtW(c.powerW) : '–';
      document.getElementById('charger-amp').textContent =
        (c.available && c.charging && c.currentA) ? (c.currentA + ' A' + (c.limitA ? ' / ' + c.limitA : '')) : '';
      document.getElementById('status').textContent = PF.statusLabel(c);
      var sdot = document.getElementById('sdot');
      sdot.className = 'sdot' + (c.status === 'Faulted' ? ' fault' : (c.charging ? ' on' : ''));

      // Bus reflects net grid: importing = red, exporting/neutral = green.
      document.getElementById('bus').className = 'bus' + (PF.busImporting(s) ? ' importing' : '');

      ORDER.forEach(function (k) {
        var node = document.querySelector('.node[data-k="' + k + '"]');
        var f = PF.flow(k, s);
        node.querySelector('[data-role="val"]').textContent = PF.fmtW(f.mag);
        var a = node.querySelector('[data-role="arrow"]');
        a.className = 'arrow' + (f.dir ? ' show ' + f.dir : '');
        a.style.color = ACCENT[k];
        if (k === 'battery') {
          node.querySelector('[data-role="soc"]').textContent = PF.socLabel(s);
        }
      });
    }

    function onHomeyReady(Homey) {
      Homey.ready();
      buildNodes();
      async function refresh() {
        try { render(await Homey.api('GET', '/getState')); } catch (e) { /* keep last */ }
      }
      refresh();
      setInterval(refresh, 3000);
    }

    // Allow standalone preview (no Homey injection) to render mock data.
    if (typeof Homey === 'undefined') { window.__standalone = true; }
  </script>
</body>
</html>
