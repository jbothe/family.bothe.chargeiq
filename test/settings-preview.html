<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ChargeIQ settings preview</title>
  <style>
    /* Dev-only preview of settings/index.html, styled with Athom's own CSS from test/homey-css/.
       Never shipped. Must be served over http(s), not file://. Background on the CSS and dark
       mode: test/homey-css/README.md. Same harness shape as test/pair-login-preview.html, with
       two differences: an app settings page is loaded standalone (no #hy-wrap/#hy-views wizard
       shell to fake, so no homey.drivers.css either - that partial is wizard-only chrome), and
       it's driven by onHomeyReady(Homey)/Homey.api() instead of Homey.emit(). */
    :root {
      --bg: #f2f3f7;
      --surface: #ffffff;
      --border: #e2e4ea;
      --text: #1a1d29;
      --text-muted: #676c7e;
      --accent: #4f46e5;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 2px rgba(16, 18, 27, 0.04), 0 8px 24px rgba(16, 18, 27, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 18px 20px 60px;
      background: var(--bg);
      color: var(--text);
    }
    .page { max-width: 760px; margin: 0 auto; }

    header { margin-bottom: 20px; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
    header p { font-size: 13px; line-height: 1.5; color: var(--text-muted); margin: 0; }
    code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 0.92em; }

    section { margin-bottom: 28px; }
    section > h2 {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); margin: 0 0 10px;
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .row > .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }

    button {
      font: inherit; font-size: 13px; font-weight: 600; color: var(--text);
      padding: 8px 14px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      box-shadow: 0 1px 2px rgba(16, 18, 27, 0.03);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }
    button:hover { border-color: #c8cbd6; background: #fafafe; }
    button:active { transform: translateY(1px); }
    button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); background: #eeecfd; }

    .controls-card {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 20px;
    }
    .controls-card .divider { width: 1px; align-self: stretch; background: var(--border); }

    .banner {
      border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 20px;
      font-size: 13px; line-height: 1.55; display: none;
    }
    .banner.visible { display: block; }
    .banner.warn { background: #fff6e5; border: 1px solid #f5d69a; color: #6b4a06; }
    .banner.ok { background: #eaf7ee; border: 1px solid #b6e2c3; color: #1e5c33; }
    .banner strong { display: block; margin-bottom: 4px; }
    .banner ul { margin: 6px 0 0; padding-left: 20px; }
    .banner li { margin-bottom: 2px; }

    .preview-card {
      display: flex; justify-content: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 24px;
    }
    .frame-wrap { display: inline-block; border: 1px solid #ccc; background: #ffffff; border-radius: 10px; overflow: hidden; }
    @media (prefers-color-scheme: dark) {
      .frame-wrap { background: #0b0d12; border-color: #333; }
    }
    html[data-theme='light'] .frame-wrap { background: #ffffff; border-color: #ccc; }
    html[data-theme='dark'] .frame-wrap { background: #0b0d12; border-color: #333; }
    iframe { display: block; width: 420px; height: 700px; border: 0; }

    .log {
      font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.6;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      box-shadow: var(--shadow); padding: 12px; max-height: 180px; overflow-y: auto;
      white-space: pre-wrap; color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>ChargeIQ settings preview</h1>
    </header>

    <div class="banner" id="banner"></div>

    <div class="controls-card">
      <div class="row">
        <span class="label">Theme</span>
        <button class="theme-btn" data-theme="light">Light</button>
        <button class="theme-btn" data-theme="dark">Dark</button>
        <button class="theme-btn" data-theme="">Auto (OS)</button>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span class="label">GET /getSchedule</span>
        <button class="get-btn" data-get="sample">Sample windows</button>
        <button class="get-btn" data-get="empty">Empty</button>
        <button class="get-btn" data-get="fail">Fails</button>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span class="label">POST /setSchedule</span>
        <button class="save-btn" data-save="ok">Succeeds</button>
        <button class="save-btn" data-save="fail">Fails</button>
      </div>
      <div class="divider"></div>
      <button id="reload">Reload view</button>
    </div>

    <section>
      <div class="preview-card">
        <div class="frame-wrap">
          <iframe id="preview" title="settings view"></iframe>
        </div>
      </div>
    </section>

    <section>
      <h2>Console / bridge log</h2>
      <div class="log" id="log"></div>
    </section>
  </div>

  <script>
    var iframe = document.getElementById('preview');
    var logEl = document.getElementById('log');
    var bannerEl = document.getElementById('banner');
    var currentTheme = '';
    var currentGet = 'sample';
    var currentSave = 'ok';
    var cssReady = false;

    // Homey darkens a page by inverting it, not by theming the --homey-* tokens (they have no
    // dark values at all). Same filter its web app defines as --theme-filter-dark-mode; the
    // hue-rotate keeps blues blue.
    var DARK_FILTER = 'invert(1) hue-rotate(180deg)';

    // Settings pages get the Style Library manifest + its six partials, same as a pair view -
    // but never homey.drivers.css, which is wizard-only chrome (#hy-wrap/#hy-views/#hy-nav) that
    // a standalone settings page has no use for and Homey doesn't inject there.
    var CSS_FILES = [
      { path: 'homey-css/css/homey.css',              required: true,  note: 'Style Library import manifest' },
      { path: 'homey-css/css/_homey-variables.css',   required: true,  note: '--homey-* colors + spacing' },
      { path: 'homey-css/css/_base.css',              required: true,  note: 'reset / base elements' },
      { path: 'homey-css/css/_homey-typography.css',  required: true,  note: '.homey-title / .homey-subtitle / .homey-form-legend' },
      { path: 'homey-css/css/_homey-button.css',      required: true,  note: '.homey-button-primary / -secondary-shadow / -danger-shadow / -transparent' },
      { path: 'homey-css/css/_homey-form.css',        required: true,  note: '.homey-form-fieldset / -checkbox / -input / -label' },
      { path: 'homey-css/css/_homey-icon.css',        required: false, note: 'unused by settings/index.html' },
      { path: 'homey-css/font/roboto/roboto.css',     required: false, note: 'Roboto @font-face declarations' },
      { path: 'homey-css/font/roboto/Roboto-Regular.ttf', required: false, note: 'Roboto 400 - subtitle, labels, inputs' },
      { path: 'homey-css/font/roboto/Roboto-Medium.ttf',  required: false, note: 'Roboto 500 - buttons' },
      { path: 'homey-css/font/roboto/Roboto-Bold.ttf',    required: false, note: 'Roboto 700 - .homey-title, window titles' },
      { path: 'homey-css/font/notosansarabic/notosansarabic.css', required: false, note: 'RTL locales only' },
      { path: 'homey-css/font/fontawesome/fontawesome.css',       required: false, note: 'icon glyphs only' }
    ];

    function log(line) {
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    function abs(path) { return new URL(path, location.href).href; }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 'ok' | 'missing' | 'errorpage'. A file saved from a wrong URL is an HTML 404 body under the
    // right filename, and passes any presence-only check - see test/homey-css/README.md.
    function exists(path) {
      return fetch(abs(path), { method: 'GET', cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) return 'missing';
          if (/\.ttf$/i.test(path)) return 'ok';
          return res.text().then(function (body) {
            return /^\s*<(!doctype\s+html|html[\s>])/i.test(body) ? 'errorpage' : 'ok';
          });
        })
        .catch(function () { return 'missing'; });
    }

    function probeCss() {
      return Promise.all(CSS_FILES.map(function (f) {
        return exists(f.path).then(function (status) {
          return { file: f, ok: status === 'ok', status: status };
        });
      })).then(function (results) {
        var missingRequired = results.filter(function (r) { return !r.ok && r.file.required; });
        var missingOptional = results.filter(function (r) { return !r.ok && !r.file.required; });
        var errorPages = results.filter(function (r) { return r.status === 'errorpage'; });
        cssReady = missingRequired.length === 0;

        function list(rows, withNote) {
          return '<ul>' + rows.map(function (r) {
            return '<li><code>test/' + esc(r.file.path) + '</code>'
              + (withNote ? ' — ' + esc(r.file.note) : '') + '</li>';
          }).join('') + '</ul>';
        }

        if (errorPages.length) {
          bannerEl.className = 'banner warn visible';
          bannerEl.innerHTML = '<strong>Saved HTML error page, not a real asset.</strong>'
            + 'Re-fetch with <code>test/homey-css/fetch.sh</code>.' + list(errorPages, false);
        } else if (missingRequired.length) {
          bannerEl.className = 'banner warn visible';
          bannerEl.innerHTML = '<strong>Incomplete — the preview will not be accurate.</strong>'
            + 'Run <code>test/homey-css/fetch.sh</code>.'
            + list(missingRequired.concat(missingOptional), true);
        } else if (missingOptional.length) {
          bannerEl.className = 'banner warn visible';
          bannerEl.innerHTML = '<strong>Optional files missing.</strong>'
            + list(missingOptional, true);
        }

        log('CSS probe: ' + missingRequired.length + ' required, '
          + missingOptional.length + ' optional missing');
      });
    }

    function applyTheme(theme) {
      currentTheme = theme;
      if (theme) document.documentElement.setAttribute('data-theme', theme);
      else document.documentElement.removeAttribute('data-theme');
      document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.setAttribute('aria-pressed', String(btn.getAttribute('data-theme') === theme));
      });
      reload();
    }

    function applyGet(outcome) {
      currentGet = outcome;
      document.querySelectorAll('.get-btn').forEach(function (btn) {
        btn.setAttribute('aria-pressed', String(btn.getAttribute('data-get') === outcome));
      });
      reload();
    }

    function applySave(outcome) {
      currentSave = outcome;
      document.querySelectorAll('.save-btn').forEach(function (btn) {
        btn.setAttribute('aria-pressed', String(btn.getAttribute('data-save') === outcome));
      });
    }

    // Mirrors ScheduleWindow's real shape (lib/control/Scheduler.ts) - two windows so the
    // conflict/no-conflict and weekly-chart rendering both have something to show.
    var SAMPLE_WINDOWS = [
      { days: [1, 2, 3, 4, 5], start: '22:00', end: '06:00', currentA: 16, enabled: true, boostToCap: true },
      { days: [6, 0], start: '09:00', end: '17:00', enabled: true, boostToCap: false }
    ];

    function stubScript() {
      // Mirrors the real Homey settings runtime: /homey.js injects window.Homey then calls the
      // page's own onHomeyReady(Homey) once ready. api.ts's real handlers always resolve/ typescript
      // never throw synchronously - the 'fail' outcomes below exercise setSchedule/getSchedule.ts's
      // own error-callback path (e.g. a network hiccup), not a documented app-level rejection.
      return '<script>\n'
        + 'window.Homey = {\n'
        + '  ready: function () { window.parent.__previewLog("Homey.ready()"); },\n'
        + '  api: function (method, path, body, callback) {\n'
        + '    window.parent.__previewLog("Homey.api(" + method + ", " + JSON.stringify(path) + ", " + JSON.stringify(body) + ")");\n'
        + '    setTimeout(function () {\n'
        + '      if (method === "GET" && path === "/getSchedule") {\n'
        + '        var g = window.parent.__previewGet();\n'
        + '        if (g === "fail") callback({ message: "Simulated getSchedule failure" });\n'
        + '        else if (g === "empty") callback(null, []);\n'
        + '        else callback(null, window.parent.__previewSampleWindows());\n'
        + '      } else if (method === "POST" && path === "/setSchedule") {\n'
        + '        var s = window.parent.__previewSave();\n'
        + '        if (s === "fail") callback({ message: "Simulated setSchedule failure" });\n'
        + '        else callback(null);\n'
        + '      } else {\n'
        + '        callback({ message: "Unhandled in preview: " + method + " " + path });\n'
        + '      }\n'
        + '    }, 200);\n'
        + '  }\n'
        + '};\n'
        + '<\/script>\n';
    }

    function cssLinks() {
      // homey.css only - no homey.drivers.css. That partial is wizard-only chrome (#hy-wrap/
      // #hy-views/#hy-nav); a standalone settings page never gets it, unlike pair/start.html.
      var links = '<link rel="stylesheet" href="' + abs('homey-css/css/homey.css') + '" />\n';
      // Filtering the root inverts its own background too, so _base.css's #fff becomes #000.
      if (currentTheme === 'dark') {
        links += '<style>html { filter: ' + DARK_FILTER + '; }</style>\n';
      }
      return links;
    }

    // Unlike the pair wizard, a settings page is loaded standalone - no #hy-wrap/.hy-view shell
    // to fake. Just swap the real <script src="/homey.js"> tag for our CSS links + Homey stub,
    // and append a caller script after the page's own (which defines onHomeyReady) to invoke it -
    // the same order /homey.js itself uses on a real device.
    function buildDocument(settingsHtml) {
      var withoutHomeyJs = settingsHtml.replace(
        /<script[^>]*\ssrc=["']\/homey\.js["'][^>]*><\/script>\s*/i,
        cssLinks() + stubScript()
      );
      return withoutHomeyJs.replace(
        /<\/body>/i,
        '<script>window.onHomeyReady(window.Homey);<\/script>\n</body>'
      );
    }

    function reload() {
      fetch('../settings/index.html', { cache: 'no-store' })
        .then(function (res) { return res.text(); })
        .then(function (html) {
          iframe.srcdoc = buildDocument(html);
          iframe.onload = function () {
            var doc = iframe.contentDocument;
            if (!doc) return;
            if (currentTheme) doc.documentElement.setAttribute('data-theme', currentTheme);
            else doc.documentElement.removeAttribute('data-theme');
          };
          log('reloaded settings/index.html (getSchedule=' + currentGet
            + ', setSchedule=' + currentSave + ', theme=' + (currentTheme || 'auto') + ')');
        });
    }

    window.__previewLog = log;
    window.__previewGet = function () { return currentGet; };
    window.__previewSave = function () { return currentSave; };
    window.__previewSampleWindows = function () {
      return JSON.parse(JSON.stringify(SAMPLE_WINDOWS));
    };

    document.querySelectorAll('.theme-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { applyTheme(btn.getAttribute('data-theme')); });
    });
    document.querySelectorAll('.get-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { applyGet(btn.getAttribute('data-get')); });
    });
    document.querySelectorAll('.save-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { applySave(btn.getAttribute('data-save')); });
    });
    document.getElementById('reload').addEventListener('click', reload);

    probeCss().then(function () {
      applyGet('sample');
      applySave('ok');
      applyTheme('');
    });
  </script>
</body>
</html>
