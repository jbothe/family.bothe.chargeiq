<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Power Flow widget preview</title>
  <style>
    /* Harness chrome only - never touches the widget itself, which renders inside the iframe
       below exactly as shipped (widgets/power-flow/public/index.html, unmodified). The iframe is
       styled with Homey's own real widget Style Library, linked from test/homey-css/widgets/
       (see that folder's README.md). The banner below reports any missing file live, via the
       same CSS-completeness probe the pair/settings previews use. */
    :root {
      --bg: #f2f3f7;
      --surface: #ffffff;
      --border: #e2e4ea;
      --text: #1a1d29;
      --text-muted: #676c7e;
      --accent: #4f46e5;
      --accent-text: #ffffff;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 2px rgba(16, 18, 27, 0.04), 0 8px 24px rgba(16, 18, 27, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 18px 20px 60px;
      background: var(--bg);
      color: var(--text);
    }
    .page { max-width: 640px; margin: 0 auto; }

    header { margin-bottom: 24px; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
    header p { font-size: 13px; line-height: 1.5; color: var(--text-muted); margin: 0; }
    header code { background: var(--border); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

    section { margin-bottom: 28px; }
    section > h2 {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); margin: 0 0 10px;
    }
    section > p.hint { font-size: 13px; color: var(--text-muted); margin: -4px 0 12px; line-height: 1.5; }

    .banner {
      border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 20px;
      font-size: 13px; line-height: 1.55; display: none;
    }
    .banner.visible { display: block; }
    .banner.warn { background: #fff6e5; border: 1px solid #f5d69a; color: #6b4a06; }
    .banner strong { display: block; margin-bottom: 4px; }
    .banner ul { margin: 6px 0 0; padding-left: 20px; }
    .banner li { margin-bottom: 2px; }
    code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 0.92em; }

    .row { display: flex; gap: 8px; flex-wrap: wrap; }

    button {
      font: inherit; font-size: 13px; font-weight: 600; color: var(--text);
      padding: 8px 14px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      box-shadow: 0 1px 2px rgba(16, 18, 27, 0.03);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }
    button:hover { border-color: #c8cbd6; background: #fafafe; }
    button:active { transform: translateY(1px); }
    button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); background: #eeecfd; }

    button.primary {
      background: var(--accent); color: var(--accent-text); border-color: var(--accent);
    }
    button.primary:hover { background: #4338ca; border-color: #4338ca; }

    /* "Realtime" controls (theme + stale) grouped together since both apply instantly with
       no intermediate state to review, unlike the preset shortcuts below. */
    .controls-card {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 20px;
    }
    .controls-card .divider { width: 1px; align-self: stretch; background: var(--border); }

    .preview-card {
      display: flex; justify-content: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 24px;
    }
    /* Harness chrome only - a plausible surface color behind the iframe's own transparent
       background (widgets/power-flow/public/index.html sets html/body background: transparent
       by design, see its own comment). Homey's own Settings > Appearance offers Light / Dark /
       System, and the app applies the *resolved* theme to a widget via `.homey-dark-mode` (see
       test/homey-css/widgets/README.md's "Dark mode" section and setDarkClass() below) plus
       pre-resolved --homey-* custom properties - that part is documented Homey behavior. The
       Light/Dark buttons below drive that same real mechanism (via setDarkClass()); [data-theme]
       here only additionally recolors this cosmetic wrapper, not the widget's own theming.
       The third "OS only" button is different: it clears `.homey-dark-mode` and leaves the
       widget's real OS/browser prefers-color-scheme alone, so only the widget's own @media-only
       fallback (--icon-blue, see widgets/power-flow/public/index.html's top-of-file comment)
       reacts. That's simulating a real scenario - Homey resolved to one theme while the device's
       OS is genuinely in the other - *if* this codebase's unconfirmed assumption holds that a
       widget's WKWebView doesn't itself propagate Homey's resolved theme as prefers-color-scheme
       (see that same top-of-file comment, and CLAUDE.md's "Not yet verified on hardware"). This
       wrapper's own cosmetic background does not follow the OS for the 'os' state - it falls
       through to the default (light) styling below since it's decorative only. */
    .frame-wrap { display: inline-block; border: 1px solid #ccc; background: #ffffff; border-radius: 10px; overflow: hidden; }
    html[data-theme='dark'] .frame-wrap { background: #0b0d12; border-color: #333; }
    iframe { display: block; width: 380px; height: 218px; border: 0; }

    textarea {
      width: 100%; height: 220px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px;
      line-height: 1.5; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px;
      resize: vertical; box-shadow: var(--shadow);
    }
    textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }

    .apply-row { margin-top: 10px; display: flex; justify-content: flex-end; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Power Flow widget preview</h1>
    </header>

    <div class="banner" id="banner"></div>

    <div class="controls-card">
      <div class="row">
        <button class="theme-btn" data-theme="light">Light</button>
        <button class="theme-btn" data-theme="dark">Dark</button>
        <button class="theme-btn" data-theme="os" title="Clears the forced .homey-dark-mode override so only the real OS/browser prefers-color-scheme drives the widget's own @media-only --icon-blue fallback - simulating Homey's resolved theme and the OS genuinely disagreeing (e.g. Homey set to Dark via Settings &gt; Appearance while iOS itself is in Light), not a synthetic/impossible state, assuming the WKWebView pass-through behavior described in this widget's top-of-file comment holds.">OS only</button>
      </div>
      <div class="divider"></div>
      <button id="toggleStale">Toggle stale</button>
    </div>

    <section>
      <div class="preview-card">
        <div class="frame-wrap">
          <iframe id="widget" src="../widgets/power-flow/public/index.html"></iframe>
        </div>
      </div>
    </section>

    <section>
      <h2>Shortcuts</h2>
      <div class="row">
        <button data-preset="idle">Idle / unplugged</button>
        <button data-preset="ready">Plugged in, ready</button>
        <button data-preset="charging">Solar charging</button>
        <button data-preset="scheduledBoost">Scheduled + boost</button>
        <button data-preset="gridCap">Grid near cap</button>
        <button data-preset="unknownBattery">Battery reading unknown</button>
        <button data-preset="unpluggedSchedule">Unplugged + schedule</button>
        <button data-preset="offline">Charger offline 12h</button>
      </div>
    </section>

    <section>
      <textarea id="customState">{}</textarea>
      <div class="apply-row"><button id="applyCustom" class="primary">Apply state</button></div>
    </section>
  </div>

  <script>
    var PRESETS = {
      idle: {
        charger: { available: true, powerW: 0, chargingState: 'plugged_out' },
        solarW: 0, gridW: 0, batteryW: 0, houseW: 0, batterySoc: 40,
        mode: 'idle',
      },
      ready: {
        charger: { available: true, powerW: 0, chargingState: 'plugged_in' },
        solarW: 200, gridW: 150, batteryW: 0, houseW: 350, batterySoc: 55,
        mode: 'solar', solarEnough: false,
      },
      charging: {
        charger: { available: true, powerW: 3680, chargingState: 'plugged_in_charging', limitA: 16 },
        solarW: 4200, gridW: -300, batteryW: 200, houseW: 800, batterySoc: 72,
        mode: 'solar', solarEnough: true,
        limits: { chargerMaxW: 7360, solarPeakW: 8000, batteryChargePeakW: 5000, batteryDischargePeakW: 5000, gridMaxW: 14000 },
      },
      scheduledBoost: {
        charger: { available: true, powerW: 7360, chargingState: 'plugged_in_charging', limitA: 32 },
        solarW: 3200, gridW: 800, batteryW: -500, houseW: 2900, batterySoc: 62,
        mode: 'scheduled', boostActive: true, scheduleEndAt: new Date(Date.now() + 3600000).toISOString(),
        limits: { chargerMaxW: 7360, solarPeakW: 8000, batteryChargePeakW: 5000, batteryDischargePeakW: 5000, gridMaxW: 14000 },
      },
      gridCap: {
        charger: { available: true, powerW: 6900, chargingState: 'plugged_in_charging', limitA: 30 },
        solarW: 500, gridW: 13600, batteryW: 0, houseW: 1200, batterySoc: 50,
        mode: 'manual',
        limits: { chargerMaxW: 7360, solarPeakW: 8000, batteryChargePeakW: 5000, batteryDischargePeakW: 5000, gridMaxW: 14000 },
      },
      unknownBattery: {
        charger: { available: true, powerW: 2000, chargingState: 'plugged_in_charging', limitA: 10 },
        solarW: 2500, gridW: -400, batteryW: 0, houseW: 700, batterySoc: null,
        mode: 'solar', solarEnough: true,
      },
      unpluggedSchedule: {
        charger: { available: true, powerW: 0, chargingState: 'plugged_out' },
        solarW: 1500, gridW: 0, batteryW: 800, houseW: 700, batterySoc: 68,
        mode: 'scheduled', scheduleEndAt: new Date(Date.now() + 5400000).toISOString(),
      },
      // The charger has been unreachable for 12h, but the last OCPP state it did
      // report said plugged-in and drawing 7.2kW. Everything under `charger` here
      // is deliberately stale-but-plausible: the point is that none of it renders
      // as if it were current.
      offline: {
        charger: {
          available: true,
          online: false,
          offlineSince: new Date(Date.now() - 12 * 3600000).toISOString(),
          powerW: 7200,
          limitA: 31,
          chargingState: 'plugged_in',
        },
        solarW: 0, gridW: 640, batteryW: 0, houseW: 640, batterySoc: 42,
        mode: 'solar', solarEnough: false,
      },
    };

    var iframe = document.getElementById('widget');
    var bannerEl = document.getElementById('banner');
    var currentTheme = 'light';

    // homey.widgets.css is the manifest (@imports the seven files below, no rules of its own) -
    // a separate Style Library from the pair/settings one (test/homey-css/css/homey.css), with
    // its own variable-naming scheme. See test/homey-css/widgets/README.md. _homey-variables.css
    // also carries the real .homey-dark-mode override block (see setDarkClass() below) - no
    // separate dark file exists or is needed.
    var CSS_FILES = [
      { path: 'homey-css/widgets/css/homey.widgets.css',    required: true,  note: 'manifest: @imports the seven files below' },
      { path: 'homey-css/widgets/css/_homey-variables.css', required: true,  note: '--homey-* custom properties + .homey-dark-mode override - everything else depends on this' },
      { path: 'homey-css/widgets/css/_homey-fonts.css',     required: true,  note: '@font-face declarations' },
      { path: 'homey-css/widgets/css/_normalize.css',       required: true,  note: 'modern-normalize v3.0.0 (third-party reset)' },
      { path: 'homey-css/widgets/css/_homey-base.css',      required: true,  note: 'html/body base, .homey-widget padding' },
      { path: 'homey-css/widgets/css/_homey-text.css',      required: true,  note: '.homey-text-* (used throughout the widget)' },
      { path: 'homey-css/widgets/css/_homey-icons.css',     required: false, note: '[class^=homey-custom-icon-] sizing - unused by this widget (inline SVG instead)' },
      { path: 'homey-css/widgets/css/_homey-borders.css',   required: false, note: '.homey-border-* - unused by this widget' },
      { path: 'homey-css/widgets/css/_homey-tables.css',    required: false, note: '.homey-table* - unused by this widget' },
      { path: 'homey-css/widgets/fonts/Roboto-Regular.ttf', required: false, note: 'Roboto 400 - body text' },
      { path: 'homey-css/widgets/fonts/Roboto-Medium.ttf',  required: false, note: 'Roboto 500 - .homey-text-medium' },
      { path: 'homey-css/widgets/fonts/Roboto-Bold.ttf',    required: false, note: 'Roboto 700 - .homey-text-bold' },
      { path: 'homey-css/widgets/fonts/Roboto-RegularItalic.ttf', required: false, note: 'unused by this widget (no italic text)' }
    ];

    function log(line) {
      // No dedicated log panel on this harness (unlike the pair/settings previews) - console is
      // enough here since this page has no bridge traffic to narrate, just CSS load state.
      // eslint-disable-next-line no-console
      console.log('[widget-preview] ' + line);
    }

    function abs(path) { return new URL(path, window.location.href).href; }
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function exists(path) {
      return fetch(abs(path), { method: 'GET', cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) return 'missing';
          if (/\.ttf$/i.test(path)) return 'ok';
          return res.text().then(function (body) {
            return /^\s*<(!doctype\s+html|html[\s>])/i.test(body) ? 'errorpage' : 'ok';
          });
        })
        .catch(function () { return 'missing'; });
    }

    function probeCss() {
      return Promise.all(CSS_FILES.map(function (f) {
        return exists(f.path).then(function (status) {
          return { file: f, ok: status === 'ok', status: status };
        });
      })).then(function (results) {
        var missingRequired = results.filter(function (r) { return !r.ok && r.file.required; });
        var missingOptional = results.filter(function (r) { return !r.ok && !r.file.required; });
        var errorPages = results.filter(function (r) { return r.status === 'errorpage'; });

        function list(rows) {
          return '<ul>' + rows.map(function (r) {
            return '<li><code>test/' + esc(r.file.path) + '</code> — ' + esc(r.file.note) + '</li>';
          }).join('') + '</ul>';
        }

        if (errorPages.length) {
          bannerEl.className = 'banner warn visible';
          bannerEl.innerHTML = '<strong>Saved HTML error page, not a real asset.</strong>'
            + 'Re-fetch with <code>test/homey-css/widgets/fetch.sh</code>.' + list(errorPages);
        } else if (missingRequired.length) {
          bannerEl.className = 'banner warn visible';
          bannerEl.innerHTML = '<strong>Incomplete — colors/spacing will not render.</strong>'
            + 'See <code>test/homey-css/widgets/README.md</code>’s "What’s missing".'
            + list(missingRequired.concat(missingOptional));
        } else if (missingOptional.length) {
          bannerEl.className = 'banner warn visible';
          bannerEl.innerHTML = '<strong>Optional files missing.</strong>' + list(missingOptional);
        }

        log('CSS probe: ' + missingRequired.length + ' required, ' + missingOptional.length
          + ' optional missing');
      });
    }

    function ensureBaseCss(doc) {
      if (!doc || doc.getElementById('homey-widgets-css')) return;
      var link = doc.createElement('link');
      link.id = 'homey-widgets-css';
      link.rel = 'stylesheet';
      link.href = abs('homey-css/widgets/css/homey.widgets.css'); // resolve against this page, not the iframe's own location
      doc.head.appendChild(link);
    }

    // _homey-variables.css carries a `.homey-dark-mode { ... }` block redeclaring every
    // mono/background/text-color/line/icon token used here, scoped to that class - the same
    // class the widget's own top-of-file comment names as "a separate, opt-in class for forcing
    // dark mode". Toggling the class on the iframe's <html> is enough once the base sheet (which
    // defines that block) is loaded.
    function setDarkClass(doc, on) {
      if (!doc || !doc.documentElement) return;
      doc.documentElement.classList.toggle('homey-dark-mode', on);
    }

    // [data-theme] on this page's <html> only drives .frame-wrap's cosmetic background above -
    // the real theming happens via setDarkClass() on the iframe's own document. theme is one of
    // 'light' | 'dark' | 'os'; only 'dark' turns .homey-dark-mode on, so 'os' (like 'light')
    // leaves it off and the widget's own @media (prefers-color-scheme) fallback is whatever the
    // real OS/browser reports - see the "OS only" button's title and the .frame-wrap comment above.
    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.setAttribute('aria-pressed', String(btn.getAttribute('data-theme') === theme));
      });
      setDarkClass(iframe.contentDocument, theme === 'dark');
    }

    iframe.addEventListener('load', function () {
      var doc = iframe.contentDocument;
      ensureBaseCss(doc);
      setDarkClass(doc, currentTheme === 'dark'); // re-apply after any (re)load, since a fresh document starts without the class
    });

    document.querySelectorAll('.theme-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        applyTheme(btn.getAttribute('data-theme'));
      });
    });

    probeCss().then(function () {
      applyTheme('light');
    });

    function applyState(state) {
      var win = iframe.contentWindow;
      if (win && typeof win.render === 'function') {
        win.render(state);
      }
    }

    // Preset buttons only fill the State textarea (pretty-printed) rather than rendering
    // directly, so a preset is a starting point to tweak, not a one-shot action - "Apply
    // state" below is still the one thing that actually calls render().
    document.querySelectorAll('button[data-preset]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var preset = PRESETS[btn.getAttribute('data-preset')];
        document.getElementById('customState').value = JSON.stringify(preset, null, 2);
      });
    });

    document.getElementById('applyCustom').addEventListener('click', function () {
      try {
        applyState(JSON.parse(document.getElementById('customState').value));
      } catch (e) {
        alert('Invalid JSON: ' + e.message);
      }
    });

    document.getElementById('toggleStale').addEventListener('click', function () {
      var doc = iframe.contentDocument;
      var card = doc && doc.querySelector('.card');
      if (card) card.classList.toggle('stale');
    });
  </script>
</body>
</html>
